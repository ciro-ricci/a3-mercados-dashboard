function lookupPizarra2025(fecha){
  // fecha viene como "DD/MM/YYYY" o "DD/MM/YY"
  if(!fecha)return null;
  const parts=fecha.split('/');
  if(parts.length<2)return null;
  const key=parts[0].padStart(2,'0')+'/'+parts[1].padStart(2,'0');

  }
  return null;
}

function parseFobFas(text){

  const pCSV=row=>{const c=[];let cur='',q=false;for(const ch of row+','){if(ch==='"')q=!q;else if(ch===','&&!q){c.push(cur.trim());cur='';}else cur+=ch;}return c;};

  const done={trigo:false,maiz:false,soja:false};
  let cult=null;

  // Detect format: markdown pipe-table vs CSV
  const lines=text.split('\n');
  const isMd=lines.some(l=>l.trim().startsWith('|'));
  for(const line of lines){
    const l=line.trim();
    if(!l)continue;
    // Detectar sección Aceitera antes de parsear celdas (funciona en texto plano y pipe-table)
    if(/aceitera/i.test(l))inAceitera=true;
    let cells,f;
    if(isMd){
      if(!l.startsWith('|'))continue;
      if(/^[|:\s\-]+$/.test(l))continue;
      cells=l.replace(/^\||\|$/g,'').split('|').map(s=>s.replace(/\\/g,'').trim());
    } else {
      cells=pCSV(l);
    }
    f=cells[0]||'';
    if(/commodity/i.test(f)){
      const c1=cells[1]||'';
      if(/trigo|wheat/i.test(c1))cult='trigo';
      else if(/ma[íi]z|corn/i.test(c1))cult='maiz';
      else if(/soja|soybean/i.test(c1))cult='soja';
      else cult=null;
    }
    if(!cult)continue;
    // Para soja en sección Aceitera: permitir sobreescribir el FAS aunque ya esté marcado como done
    const allowFasOverride=cult==='soja'&&inAceitera;
    if(done[cult]&&!allowFasOverride)continue;
    if(/fob.*(comprador|bid)/i.test(f)){const v=pN(cells[1]);if(v&&!done[cult])res[cult].fob=v;}

}

function parseDollarRatesCSV(text){const fl=text.trim().split("\n")[0]||"";if(fl.includes("|"))return null;
  const pRow=row=>{const c=[];let cur='',q=false;for(const ch of row+','){if(ch==='"')q=!q;else if(ch===','&&!q){c.push(cur.trim());cur='';}else cur+=ch;}return c;};
  const lines=text.trim().split(/\r?\n/);if(lines.length<2)return null;
  const hdrs=pRow(lines[0]).map(h=>h.toLowerCase().replace(/['"]/g,'').trim());
  const iTipo=hdrs.findIndex(h=>h.includes('tipo'));
  const iCompra=hdrs.findIndex(h=>h.includes('compra'));
  const iVenta=hdrs.findIndex(h=>h.includes('venta'));
  if(iTipo<0||iVenta<0)return null;
  const pN=s=>{if(!s)return null;s=String(s).replace(/[$\s"]/g,'').trim();const n=parseFloat(s.replace(',','.'));return isNaN(n)?null:n;};
  const res=[];
  for(let i=1;i<lines.length;i++){
    const p=pRow(lines[i]);if(!p[iTipo])continue;
    const tipo=p[iTipo].replace(/['"]/g,'').trim();if(!tipo)continue;
    res.push({tipo,compra:pN(p[iCompra]),venta:pN(p[iVenta])});
  }
  return res.length?res:null;
}
function parseDollarRatesMd(text){
  const res=[];
  for(const line of text.split('\n')){
    const l=line.trim();
    if(!l.startsWith('|'))continue;
    if(/^[|:\s\-]+$/.test(l))continue;
    const cells=l.replace(/^\||\|$/g,'').split('|').map(s=>s.replace(/\\/g,'').trim());
    if(cells.length<3)continue;
    const tipo=cells[0];if(!tipo||/tipo/i.test(tipo))continue;
    const pN=s=>{const n=parseFloat((s||'').replace(',','.'));return isNaN(n)?null:n;};
    res.push({tipo,compra:pN(cells[1]),venta:pN(cells[2])});
  }
  return res.length?res:null;
}

function buildChain(panelId,opts,vencs){
  const panel=document.getElementById('panel-'+panelId);
  const futs=panelId==='soj-opts'?SOJ_FUT:panelId==='mai-opts'?MAI_FUT:TRI_FUT;
  function getFutPrice(venc){if(!futs||!futs.length)return null;const r=futs.find(f=>f.venc_display===venc&&f.ajuste&&f.ajuste!=='N/A'&&!isNaN(parseFloat(f.ajuste)));return r?parseFloat(r.ajuste):null;}

      const futPrice=getFutPrice(venc);
      const filtered=opts.filter(r=>r.venc_serie===venc);
      if(!filtered.length)return '';

      filtered.forEach(r=>{if(r.tipo_op==='C')callMap[r.strike]=r;else putMap[r.strike]=r;});

      if(!strikes.length)return '';

      // Filtrar strikes con actividad (IA o volumen > 0 en call o put)
      const toN=v=>v&&v!=='N/A'?parseInt(v)||0:0;
      const activeStrikes=strikes.filter(s=>{const c=callMap[s]||{},p=putMap[s]||{};return toN(c.interes_abierto)>0||toN(c.volumen)>0||toN(p.interes_abierto)>0||toN(p.volumen)>0;});

function renderStratResults(){const container=document.getElementById('strat-results');if(stratLegs.length===0){container.innerHTML='<div style="color:#aaa;font-size:0.85rem;font-style:italic;padding:20px 0">Aplicá una estrategia para ver el análisis</div>';if(stratChart){stratChart.destroy();stratChart=null;}return;}const strikes=stratLegs.map(l=>l.strike);const midStrike=strikes.reduce((a,b)=>a+b,0)/strikes.length;const minS=Math.round(midStrike*0.65),maxS=Math.round(midStrike*1.35),step=(maxS-minS)/200;const prices=[];for(let s=minS;s<=maxS;s+=step)prices.push(parseFloat(s.toFixed(2)));const payoffs=prices.map(s=>parseFloat(totalPayoff(s).toFixed(4)));const primaNeta=stratLegs.reduce((sum,l)=>sum+(l.accion==='C'?-l.prima:l.prima),0);const maxGain=Math.max(...payoffs),maxLoss=Math.min(...payoffs);const breakevens=[];for(let i=0;i<payoffs.length-1;i++){if((payoffs[i]<=0&&payoffs[i+1]>0)||(payoffs[i]>=0&&payoffs[i+1]<0))breakevens.push((prices[i]+(prices[i+1]-prices[i])*(-payoffs[i])/(payoffs[i+1]-payoffs[i])).toFixed(2));}const isGainInfinite=maxGain>midStrike*2,isLossInfinite=maxLoss<-midStrike;const presetName=selectedPreset?(PRESET_STRATEGIES.find(p=>p.id===selectedPreset)?.nombre||''):'';container.innerHTML=`<div class="full-card" style="margin-bottom:12px;padding:14px 18px"><div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px"><h3 style="margin:0">${presetName||'Estrategia personalizada'}</h3><button class="btn-clear" onclick="clearStratLegs()">✕ Limpiar</button></div><div class="kpi-row" style="margin-bottom:0"><div class="kpi ${primaNeta>=0?'green':'red'}"><div class="label">Prima Neta</div><div class="value">${primaNeta>=0?'+':''}${primaNeta.toFixed(4)}</div><div class="sub">USD/tn · ${primaNeta>=0?'cobrada':'pagada'}</div></div><div class="kpi ${isGainInfinite?'':'green'}"><div class="label">Ganancia Máx.</div><div class="value">${isGainInfinite?'∞':(maxGain>=0?'+':'')+maxGain.toFixed(4)}</div><div class="sub">USD/tn al vencimiento</div></div><div class="kpi ${isLossInfinite?'':'red'}"><div class="label">Pérdida Máx.</div><div class="value">${isLossInfinite?'-∞':maxLoss.toFixed(4)}</div><div class="sub">USD/tn al vencimiento</div></div><div class="kpi yellow"><div class="label">Breakeven${breakevens.length!==1?'s':''}</div><div class="value" style="font-size:1rem">${breakevens.length>0?breakevens.join(' / '):'—'}</div><div class="sub">USD/tn</div></div></div></div><div class="full-card"><h3>Payoff al Vencimiento <span style="font-size:0.78rem;font-weight:400;text-transform:none;color:#888">USD/tn</span></h3><div class="canvas-wrap-lg"><canvas id="strat-payoff-chart"></canvas></div></div>`;if(stratChart){stratChart.destroy();stratChart=null;}setTimeout(()=>{const ctx=document.getElementById('strat-payoff-chart');if(!ctx)return;stratChart=new Chart(ctx,{type:'line',data:{labels:prices.map(p=>p.toFixed(0)),datasets:[{label:'Resultado (USD/tn)',data:payoffs,borderWidth:2,pointRadius:0,tension:0.1,fill:false,segment:{borderColor:ctx2=>ctx2.p0.parsed.y>=0&&ctx2.p1.parsed.y>=0?'rgba(34,134,58,0.9)':ctx2.p0.parsed.y<0&&ctx2.p1.parsed.y<0?'rgba(203,36,49,0.9)':'rgba(150,150,150,0.7)'}}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{callbacks:{title:items=>`Precio subyacente: USD ${items[0].label}`,label:item=>`Resultado: ${item.raw>=0?'+':''}${item.raw.toFixed(4)} USD/tn`}}},scales:{x:{grid:{display:false},ticks:{maxTicksLimit:10,font:{size:11}},title:{display:true,text:'Precio subyacente (USD/tn)',font:{size:11}}},y:{grid:{color:'#f0f2f5'},ticks:{font:{size:11}},title:{display:true,text:'Resultado (USD/tn)',font:{size:11}},afterDataLimits:scale=>{const r=scale.max-scale.min;scale.max+=r*0.1;scale.min-=r*0.1;}}}}});},50);}

function buildBriefGranosPanel(){
  var panel = document.getElementById('panel-brief-granos');
  if(!panel) return;
  var d = BRIEF_GRANOS_DATA;

  function balance(factores){
    var up=0, down=0;
    factores.forEach(function(f){ if(f.dir==='alcista') up++; else if(f.dir==='bajista') down++; });
    var cls = up>down ? 'alcista' : (down>up ? 'bajista' : 'neutral');
    var icon = cls==='alcista' ? '🟢' : (cls==='bajista' ? '🔴' : '⚪');
    return {cls:cls, icon:icon, up:up, down:down, neu: factores.length-up-down};
  }

  var tabsHtml = '<div class="bg-tabs">' + d.cultivos.map(function(c){
    var b = balance(c.factores);
    var label = c.nombre.split(' (')[0];
    return '<span class="bg-tab ' + b.cls + '" onclick="var el=document.getElementById(\'bg-' + c.id + '\'); if(el) el.scrollIntoView({behavior:\'smooth\'});">' + b.icon + ' ' + label + '</span>';
  }).join('') + '</div>';

  var execHtml = '<div class="bg-exec"><h3>Resumen ejecutivo</h3><ul>' +
    d.resumen.map(function(r){ return '<li>' + r + '</li>'; }).join('') +
    '</ul></div>';

  var cropsHtml = d.cultivos.map(function(c){
    var b = balance(c.factores);
    var pillLabel = b.cls==='alcista' ? 'Neto alcista' : (b.cls==='bajista' ? 'Neto bajista' : 'Parejo / sin datos');
    var factoresHtml = c.factores.length ? c.factores.map(function(f){
      var icon = f.dir==='alcista' ? '🟢' : (f.dir==='bajista' ? '🔴' : '⚪');
      var fuenteHtml = f.url
        ? '<span class="bg-fuente">Fuente: <a href="' + f.url + '" target="_blank" rel="noopener">' + f.fuente + '</a></span>'
        : '<span class="bg-fuente">Sin fuente puntual</span>';
      return '<div class="bg-factor ' + f.dir + '"><div>' + icon + '</div><div><b>' + f.titulo + '</b>' + f.texto + fuenteHtml + '</div></div>';
    }).join('') : '<div class="bg-factor neutral"><div>⚪</div><div>Sin novedades relevantes hoy.</div></div>';

    return '<div class="bg-crop" id="bg-' + c.id + '"><div class="bg-crop-title">' + c.icon + ' ' + c.nombre +
      '<span class="bg-pill ' + b.cls + '">' + pillLabel + ' (' + b.up + ' 🟢 / ' + b.down + ' 🔴 / ' + b.neu + ' ⚪)</span></div>' +
      factoresHtml + '</div>';
  }).join('');

  panel.innerHTML =
    '<div class="bg-header"><h2>🌾 Brief Diario de Mercado de Granos</h2><div class="bg-meta">Actualizado: ' + d.fecha + '</div></div>' +
    tabsHtml + execHtml + cropsHtml;
}

// DEUDA / STOCK — planificador de ventas para cubrir compromisos
// Reutiliza SOJ_FUT/MAI_FUT/TRI_FUT/SPOT/VENC_DATES ya cargados por A3.
// ══════════════════════════════════════════════════════════════════════
const DS_STORAGE_KEY='ds_state_v1';
const DS_GRAIN_LABEL={soja:'Soja',maiz:'Maíz',trigo:'Trigo'};
const DS_GRAIN_COLOR={soja:'#2e7d32',maiz:'#e65100',trigo:'#1565c0'};
const DS_GRAIN_BADGE={soja:'ds-badge-soja',maiz:'ds-badge-maiz',trigo:'ds-badge-trigo'};
const DS_MONEDA_LABEL={usd:'USD',ars:'ARS',soja:'Soja (tn)',maiz:'Maíz (tn)',trigo:'Trigo (tn)'};
const DS_MONEDAS=['usd','ars','soja','maiz','trigo'];

function dsTc(){
  return(typeof SPOT!=='undefined'&&SPOT&&SPOT.tc)?SPOT.tc:null;
}
function dsSpotPrice(cult){
  const tc=dsTc();
  const arsVal=(typeof SPOT!=='undefined'&&SPOT)?SPOT[cult+'_ars']:null;
  if(!tc||!arsVal)return null;
  const stockPrecioPropio=window.DS_STATE&&window.DS_STATE.stock[cult]&&window.DS_STATE.stock[cult].precio;
  return stockPrecioPropio||(arsVal/tc);
}
// Convierte un monto denominado en cualquier moneda/grano a su equivalente en USD,
// usando el TC oficial y el disponible en USD de cada grano. Devuelve null si no hay
// datos suficientes para convertir (ej: sin TC o sin spot cargado todavía).
function dsMontoUsd(moneda,monto){
  if(!monto)return 0;
  if(moneda==='usd'||!moneda)return monto;
  if(moneda==='ars'){
    const tc=dsTc();
    return tc?monto/tc:null;
  }
  if(DS_GRAIN_LABEL[moneda]){
    const precio=dsSpotPrice(moneda);
    return precio?monto*precio:null;
  }
  return monto;
}

function dsDefaultState(){
  return{
    vencimientos:[],
    cxc:[],
    considerarCxc:false,
    stock:{
      soja:{cantidad:0,precio:null,cosechaCantidad:0,cosechaFecha:''},
      maiz:{cantidad:0,precio:null,cosechaCantidad:0,cosechaFecha:''},
      trigo:{cantidad:0,precio:null,cosechaCantidad:0,cosechaFecha:''}
    },
    sens:{soja:0,maiz:0,trigo:0,tc:0}
  };
}
function dsLoadState(){
  try{
    const raw=localStorage.getItem(DS_STORAGE_KEY);
    if(raw){
      const parsed=JSON.parse(raw);
      if(parsed._savedAt)window.DS_LAST_SAVED=new Date(parsed._savedAt);
      const base=dsDefaultState();
      base.vencimientos=(parsed.vencimientos||[]).map(function(v){return Object.assign({fecha:'',monto:0,moneda:'usd'},v);});
      base.cxc=parsed.cxc||[];
      base.considerarCxc=!!parsed.considerarCxc;
      if(parsed.stock){
        ['soja','maiz','trigo'].forEach(function(c){
          if(parsed.stock[c])base.stock[c]=Object.assign(base.stock[c],parsed.stock[c]);
        });
      }
      if(parsed.sens)base.sens=Object.assign(base.sens,parsed.sens);
      return base;
    }
  }catch(e){}
  return dsDefaultState();
}

function dsFmtUsd(n){
  if(n===null||n===undefined||isNaN(n))return'—';
  return'USD '+Math.round(n).toLocaleString('es-AR');
}
function dsFmtTn(n){
  if(n===null||n===undefined||isNaN(n))return'—';
  return n.toLocaleString('es-AR',{maximumFractionDigits:1})+' tn';
}
function dsParseNum(str){
  if(str===null||str===undefined)return 0;
  str=String(str).trim();
  if(!str)return 0;
  str=str.replace(/\./g,'').replace(',','.');
  const n=parseFloat(str);
  return isNaN(n)?0:n;
}
function dsFmtNumInput(n){
  if(n===null||n===undefined||isNaN(n)||n===0)return'';
  return n.toLocaleString('es-AR',{maximumFractionDigits:2});
}
function dsParseFecha(ym){
  if(!ym)return null;
  const m=/^(\d{4})-(\d{2})$/.exec(ym);
  if(!m)return null;
  const y=parseInt(m[1]),mo=parseInt(m[2]);
  return new Date(y,mo,0);
}
function dsFechaLabel(ym){
  const f=dsParseFecha(ym);
  if(!f)return ym||'—';
  const meses=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return meses[f.getMonth()]+' '+f.getFullYear();
}

function dsPosicionesGrano(cult){
  const arr=cult==='soja'?SOJ_FUT:cult==='maiz'?MAI_FUT:TRI_FUT;
  const out=[];
  const spotArs=SPOT?SPOT[cult+'_ars']:null;
  const tc=SPOT?SPOT.tc:null;
  if(spotArs&&tc){
    out.push({posicion:'Disponible',fecha:new Date(),precio:spotArs/tc,esSpot:true});
  }
  (arr||[]).forEach(function(r){
    const p=parseFloat(r.ajuste);
    if(isNaN(p)||!r.venc_display)return;
    const f=(typeof VENC_DATES!=='undefined'&&VENC_DATES[r.venc_display])||(typeof parseDlrDate==='function'?parseDlrDate(r.venc_display):null);
    if(!f)return;
    out.push({posicion:r.venc_display,fecha:f,precio:p,esSpot:false});
  });
  return out.sort(function(a,b){return a.fecha-b.fecha;});
}

function dsOptimizar(sensOverride){
  const st=window.DS_STATE;
  const sens=sensOverride||st.sens;
  const posicionesPorGrano={};
  ['soja','maiz','trigo'].forEach(function(cult){
    const pct=(sens[cult]||0)/100;
    const tcPct=(sens.tc||0)/100;
    const stockPrecioPropio=st.stock[cult]&&st.stock[cult].precio;
    posicionesPorGrano[cult]=dsPosicionesGrano(cult).map(function(p){
      let precio=p.precio;
      if(p.esSpot){
        if(stockPrecioPropio){
          precio=stockPrecioPropio;
        }else{
          const spotArs=SPOT?SPOT[cult+'_ars']:null;
          const tc=SPOT?SPOT.tc:null;
          if(spotArs&&tc)precio=spotArs/(tc*(1+tcPct));
        }
      }
      precio=precio*(1+pct);
      return{posicion:p.posicion,fecha:p.fecha,precio:precio,cult:cult};
    });
  });

  const stockRestante={
    soja:(st.stock.soja&&st.stock.soja.cantidad)||0,
    maiz:(st.stock.maiz&&st.stock.maiz.cantidad)||0,
    trigo:(st.stock.trigo&&st.stock.trigo.cantidad)||0
  };

  // Cosecha esperada: se suma al stock disponible recién a partir de su fecha esperada,
  // no desde ya (todavía no está físicamente en la tranquera).
  const cosechaEventos=['soja','maiz','trigo'].map(function(cult){
    const s=st.stock[cult]||{};
    const cantidad=s.cosechaCantidad||0;
    const fecha=dsParseFecha(s.cosechaFecha);
    return{cult:cult,cantidad:cantidad,fecha:fecha};
  }).filter(function(e){return e.cantidad>0&&e.fecha;}).sort(function(a,b){return a.fecha-b.fecha;});
  let cosechaIdx=0;

  const compromisos=(st.vencimientos||[]).map(function(v){
    const monto=dsMontoUsd(v.moneda,v.monto);
    return{monto:monto||0,montoOrig:v.monto,moneda:v.moneda||'usd',fecha:dsParseFecha(v.fecha),fechaStr:v.fecha,sinConvertir:v.monto>0&&monto==null};
  }).filter(function(v){return v.fecha&&v.montoOrig>0;}).sort(function(a,b){return a.fecha-b.fecha;});
  const cobros=st.considerarCxc?(st.cxc||[]).map(function(c){return{monto:c.monto,fecha:dsParseFecha(c.fecha),fechaStr:c.fecha};}).filter(function(c){return c.fecha&&c.monto>0;}).sort(function(a,b){return a.fecha-b.fecha;}):[];

  let deudaAcum=0,ingresosAcum=0,cobrosAcum=0,cIdx=0;
  const ventas=[];
  const coberturaTimeline=[];

  compromisos.forEach(function(comp){
    while(cIdx<cobros.length&&cobros[cIdx].fecha<=comp.fecha){
      cobrosAcum+=cobros[cIdx].monto;
      cIdx++;
    }
    while(cosechaIdx<cosechaEventos.length&&cosechaEventos[cosechaIdx].fecha<=comp.fecha){
      stockRestante[cosechaEventos[cosechaIdx].cult]+=cosechaEventos[cosechaIdx].cantidad;
      cosechaIdx++;
    }
    deudaAcum+=comp.monto;
    let necesidad=deudaAcum-(ingresosAcum+cobrosAcum);

    if(necesidad>0){
      let candidatos=[];
      ['soja','maiz','trigo'].forEach(function(cult){
        if(stockRestante[cult]<=0)return;
        posicionesPorGrano[cult].forEach(function(p){
          if(p.fecha<=comp.fecha)candidatos.push(p);
        });
      });
      candidatos.sort(function(a,b){return b.precio-a.precio;});
      for(let i=0;i<candidatos.length&&necesidad>0;i++){
        const cand=candidatos[i];
        const stockDisp=stockRestante[cand.cult];
        if(stockDisp<=0)continue;
        const tnNecesarias=necesidad/cand.precio;
        const tnAsignar=Math.min(stockDisp,tnNecesarias);
        if(tnAsignar<=0)continue;
        const ingreso=tnAsignar*cand.precio;
        ventas.push({fecha:comp.fecha,fechaStr:comp.fechaStr,producto:cand.cult,posicion:cand.posicion,toneladas:tnAsignar,precio:cand.precio,ingreso:ingreso});
        stockRestante[cand.cult]-=tnAsignar;
        ingresosAcum+=ingreso;
        necesidad-=ingreso;
      }
    }
    const coberturaPct=deudaAcum>0?Math.min(100,((ingresosAcum+cobrosAcum)/deudaAcum)*100):100;
    coberturaTimeline.push({fecha:comp.fecha,fechaStr:comp.fechaStr,coberturaPct:coberturaPct,deudaAcum:deudaAcum,disponibleAcum:ingresosAcum+cobrosAcum});
  });

  const deudaTotal=compromisos.reduce(function(a,c){return a+c.monto;},0);
  const cxcTotal=cobros.reduce(function(a,c){return a+c.monto;},0);
  const exposicionNeta=deudaTotal-cxcTotal;
  const ingresoProyectado=ventas.reduce(function(a,v){return a+v.ingreso;},0);
  const excedente=(ingresoProyectado+cxcTotal)-deudaTotal;
  const coberturaFinal=deudaTotal>0?Math.min(100,((ingresoProyectado+cxcTotal)/deudaTotal)*100):100;
  const tnVendidas=ventas.reduce(function(a,v){return a+v.toneladas;},0);
  const precioPromedio=tnVendidas>0?ingresoProyectado/tnVendidas:null;
  const hayDeudaSinConvertir=compromisos.some(function(c){return c.sinConvertir;});

  // ── Posición neta de granos: stock disponible + cosecha esperada − deuda tomada en ese grano ──
  const deudaEnGranoTn={soja:0,maiz:0,trigo:0};
  (st.vencimientos||[]).forEach(function(v){
    if(DS_GRAIN_LABEL[v.moneda]&&v.monto>0)deudaEnGranoTn[v.moneda]+=v.monto;
  });
  const posicionNetaGranos={};
  ['soja','maiz','trigo'].forEach(function(cult){
    const s=st.stock[cult]||{};
    posicionNetaGranos[cult]=(s.cantidad||0)+(s.cosechaCantidad||0)-deudaEnGranoTn[cult];
  });

  // ── Deuda neta consolidada, expresada en distintas unidades ──
  const tc=dsTc();
  const precioSoja=dsSpotPrice('soja');
  const precioMaiz=dsSpotPrice('maiz');
  const deudaNetaUsd=exposicionNeta;
  const deudaNetaArs=tc!=null?deudaNetaUsd*tc:null;
  const deudaNetaSojaTn=precioSoja?deudaNetaUsd/precioSoja:null;
  const deudaNetaMaizTn=precioMaiz?deudaNetaUsd/precioMaiz:null;

  return{
    ventas:ventas,stockRestante:stockRestante,compromisos:compromisos,cobros:cobros,
    coberturaTimeline:coberturaTimeline,deudaTotal:deudaTotal,cxcTotal:cxcTotal,
    exposicionNeta:exposicionNeta,ingresoProyectado:ingresoProyectado,excedente:excedente,
    coberturaFinal:coberturaFinal,precioPromedio:precioPromedio,hayDeudaSinConvertir:hayDeudaSinConvertir,
    posicionNetaGranos:posicionNetaGranos,deudaNetaUsd:deudaNetaUsd,deudaNetaArs:deudaNetaArs,
    deudaNetaSojaTn:deudaNetaSojaTn,deudaNetaMaizTn:deudaNetaMaizTn
  };
}

function dsRenderCronograma(res){
  const ctx=document.getElementById('ds-chart-cronograma');
  if(!ctx||!window.Chart)return;
  const fechas=Array.from(new Set(
    res.compromisos.map(function(c){return c.fechaStr;})
    .concat(res.cobros.map(function(c){return c.fechaStr;}))
    .concat(res.ventas.map(function(v){return v.fechaStr;}))
  )).sort();
  if(!fechas.length){
    if(ctx._chartInst){ctx._chartInst.destroy();ctx._chartInst=null;}
    return;
  }
  const labels=fechas.map(dsFechaLabel);
  const deudaData=fechas.map(function(f){
    return res.compromisos.filter(function(c){return c.fechaStr===f;}).reduce(function(a,c){return a+c.monto;},0);
  });
  const cobroData=fechas.map(function(f){
    return res.cobros.filter(function(c){return c.fechaStr===f;}).reduce(function(a,c){return a+c.monto;},0);
  });
  const ventaData=fechas.map(function(f){
    return res.ventas.filter(function(v){return v.fechaStr===f;}).reduce(function(a,v){return a+v.ingreso;},0);
  });
  if(ctx._chartInst)ctx._chartInst.destroy();
  ctx._chartInst=new Chart(ctx,{
    type:'bar',
    data:{labels:labels,datasets:[
      {label:'Compromisos',data:deudaData.map(function(v){return-v;}),backgroundColor:'#ef4444cc',stack:'flujo'},
      {label:'Cuentas por cobrar',data:cobroData,backgroundColor:'#22c55ecc',stack:'flujo'},
      {label:'Ventas proyectadas',data:ventaData,backgroundColor:'#3b82f6cc',stack:'flujo'}
    ]},
    options:{
      responsive:true,maintainAspectRatio:false,
      scales:{
        x:{stacked:true},
        y:{stacked:true,ticks:{callback:function(v){return dsFmtUsd(v);}}}
      },
      plugins:{
        legend:{position:'bottom'},
        tooltip:{
          callbacks:{
            label:function(item){return item.dataset.label+': '+dsFmtUsd(Math.abs(item.raw));},
            footer:function(items){
              const neto=items.reduce(function(a,it){return a+it.raw;},0);
              return'Neto del mes: '+dsFmtUsd(neto);
            }
          }
        }
      }
    }
  });
}

function dsCapacidadMaxima(sens){
  const st=window.DS_STATE;
  let total=0;
  ['soja','maiz','trigo'].forEach(function(cult){
    const s=st.stock[cult]||{};
    const cantidad=(s.cantidad||0)+(s.cosechaCantidad||0);
    if(cantidad<=0)return;
    const pct=(sens[cult]||0)/100;
    const tcPct=(sens.tc||0)/100;
    const stockPrecioPropio=st.stock[cult]&&st.stock[cult].precio;
    const posiciones=dsPosicionesGrano(cult).map(function(p){
      let precio=p.precio;
      if(p.esSpot){
        if(stockPrecioPropio){precio=stockPrecioPropio;}
        else{
          const spotArs=SPOT?SPOT[cult+'_ars']:null;
          const tc=SPOT?SPOT.tc:null;
          if(spotArs&&tc)precio=spotArs/(tc*(1+tcPct));
        }
      }
      return precio*(1+pct);
    });
    if(!posiciones.length)return;
    total+=cantidad*Math.max.apply(null,posiciones);
  });
  return total;
}

function dsRenderSensChart(sens){
  const ctx=document.getElementById('ds-chart-sens');
  if(!ctx||!window.Chart)return;
  const res=dsOptimizar(sens);
  const necesidad=Math.max(0,res.deudaTotal-res.cxcTotal);
  const capacidad=dsCapacidadMaxima(sens);
  const excedente=capacidad-necesidad;
  const barColor=necesidad<=0?'#94a3b8cc':(excedente>=0?'#22c55ecc':'#ef4444cc');
  const subtitle=necesidad<=0?'Sin compromisos cargados todavía':
    (excedente>=0?'Te alcanza · margen: '+dsFmtUsd(excedente):'No te alcanza · faltante: '+dsFmtUsd(Math.abs(excedente)));
  if(ctx._chartInst){
    const c=ctx._chartInst;
    c.data.datasets[0].data=[necesidad,capacidad];
    c.data.datasets[0].backgroundColor=['#94a3b8cc',barColor];
    c.options.plugins.subtitle.text=subtitle;
    c.options.plugins.subtitle.color=necesidad<=0?'#888':(excedente>=0?'#16a34a':'#dc2626');
    c.update();
    return;
  }
  ctx._chartInst=new Chart(ctx,{
    type:'bar',
    data:{labels:['Necesitás cubrir','Podés generar con todo tu stock'],datasets:[{data:[necesidad,capacidad],backgroundColor:['#94a3b8cc',barColor],borderRadius:6}]},
    options:{
      indexAxis:'y',responsive:true,maintainAspectRatio:false,
      scales:{x:{ticks:{callback:function(v){return dsFmtUsd(v);}}}},
      plugins:{
        legend:{display:false},
        subtitle:{display:true,text:subtitle,font:{size:13,weight:'700'},color:necesidad<=0?'#888':(excedente>=0?'#16a34a':'#dc2626'),padding:{bottom:10}},
        tooltip:{callbacks:{label:function(item){return dsFmtUsd(item.raw);}}}
      }
    }
  });
}

function dsRefresh(){
  const res=dsOptimizar();
  dsRenderPosicionNeta(res);
  dsRenderKPIs(res);
  dsRenderTablaVentas(res);
  dsRenderCronograma(res);
  dsRenderSensChart(window.DS_STATE.sens);
  dsRenderSaveStatus();
}

let _gmCultivo='girasol';
function buildGirasolManiPanel(){
  _gmRenderBtns();
  _gmRenderBody();
}
function _gmRenderBtns(){
  const wrap=document.getElementById('gm-cult-btns');
  if(!wrap)return;
  const cults=[{c:'girasol',lbl:'Girasol',cc:'#ca8a04'},{c:'mani',lbl:'Maní',cc:'#92400e'}];
  wrap.innerHTML=cults.map(({c,lbl,cc})=>{
    const act=c===_gmCultivo;
    return `<button onclick="_gmSetCultivo('${c}')" style="padding:8px 22px;border:2px solid ${act?cc:'#dde'};border-radius:8px;font-size:0.85rem;font-weight:700;cursor:pointer;background:${act?cc:'white'};color:${act?'white':'#555'};transition:all 0.15s">${lbl}</button>`;
  }).join('');
}
function _gmSetCultivo(c){
  _gmCultivo=c;
  _gmRenderBtns();
  _gmRenderBody();
}
function _gmKpiCard(label,value,sub,color){
  return `<div style="background:white;border-radius:10px;padding:12px 16px;flex:1;min-width:150px;box-shadow:0 2px 8px rgba(0,0,0,0.07);border-top:3px solid ${color}">
    <div style="font-size:0.68rem;color:#888;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px">${label}</div>
    <div style="font-size:1.4rem;font-weight:800;color:${color}">${value}</div>
    <div style="font-size:0.72rem;margin-top:4px;color:#888">${sub}</div>
  </div>`;
}
function _gmRenderBody(){
  const body=document.getElementById('gm-body');
  if(!body)return;
  if(_gmCultivo==='girasol') body.innerHTML=_gmGirasolHtml();
  else body.innerHTML=_gmManiHtml();
  if(_gmCultivo==='girasol') setTimeout(function(){_gmDrawGirasolChart();_gmDrawGirasolFobChart();},60);
  else setTimeout(function(){_gmDrawManiRunnerArsChart();_gmDrawManiRunnerUsdChart();},60);
}
function _gmGirasolHtml(){
  const g=GIRASOL_MANI_DATA.girasol;
  const histG=g.hist_usd||[];
  const ultimoUsdOficial=[...histG].reverse().find(h=>h.valor!=null);
  const dispUsd=ultimoUsdOficial?ultimoUsdOficial.valor:null;
  const cards=[
    _gmKpiCard('Disponible Rosario','$'+g.disponible_rosario_ars.toLocaleString('es-AR'),'Cámara Arbitral · '+g.fecha,'#ca8a04'),
    _gmKpiCard('Disponible (equiv. USD)',dispUsd!=null?('USD '+dispUsd):'—',(dispUsd!=null?(ultimoUsdOficial.fecha+' · '):'')+'pizarra Rosario','#ca8a04'),
    _gmKpiCard('FOB oficial (Ley 21.453)','USD '+g.fob_oficial_usd,'posición '+g.fob_posicion,'#ca8a04'),
    _gmKpiCard(g.internacional_label,'USD '+g.internacional_usd,'referencia internacional','#ca8a04')
  ].join('');
  return `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px">${cards}</div>
    <div class="full-card">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;flex-wrap:wrap;gap:6px">
        <h3 style="margin:0">Evolución disponible girasol — pizarra Rosario</h3>
        <span style="font-size:0.72rem;color:#aaa">en USD, serie diaria</span>
      </div>
      <div class="canvas-wrap" style="height:280px"><canvas id="gm-girasol-chart"></canvas></div>
      <div style="font-size:0.7rem;color:#bbb;margin-top:8px;font-style:italic">Los huecos entre puntos corresponden a días sin fijaciones registradas en pizarra, no a un error de carga.</div>
  </div>
  <div class="full-card" style="margin-top:18px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;flex-wrap:wrap;gap:6px">
      <h3 style="margin:0">Evolución FOB girasol (Ley 21.453)</h3>
      <span style="font-size:0.72rem;color:#aaa">en USD/tn, serie diaria</span>
      </div>
      <div class="canvas-wrap" style="height:280px"><canvas id="gm-girasol-fob-chart"></canvas></div>
      <div style="font-size:0.7rem;color:#bbb;margin-top:8px;font-style:italic">Backfill 2022-2026 cargado una sola vez; de ahí en más se va sumando solo el último FOB relevado cada semana.</div>
    </div>`;
}
function _gmDrawGirasolChart(){
  const el=document.getElementById('gm-girasol-chart');
  if(!el)return;
  if(window._gmChart){try{window._gmChart.destroy();}catch(e){}}

var _usdaCharts = {};
var _usdaCrop = 'soja';

function _uFmt(v, dec) {
  if (v === null || v === undefined) return '—';
  return v.toLocaleString('es-AR', {minimumFractionDigits: dec || 0, maximumFractionDigits: dec || 0});
}

function _uDelta(actual, previo, dec, invertir) {
  // invertir=true -> que suba es bajista (caso stocks)
  if (actual === null || previo === null || actual === undefined || previo === undefined) {
    return '<span class="flat">—</span>';
  }
  var d = actual - previo;
  if (Math.abs(d) < 0.001) return '<span class="flat">sin cambios</span>';
  var bueno = invertir ? d < 0 : d > 0;
  var cls = bueno ? 'up' : 'down';
  var sign = d > 0 ? '+' : '';
  return '<span class="' + cls + '">' + sign + _uFmt(d, dec) + '</span>';
}

function _uDestroy(id) {
  if (_usdaCharts[id]) { try { _usdaCharts[id].destroy(); } catch (e) {} delete _usdaCharts[id]; }
}

function usdaSetCrop(crop) {
  _usdaCrop = crop;
  document.querySelectorAll('#panel-usda .u-subtab').forEach(function (t) {
    t.classList.toggle('active', t.dataset.crop === crop);
  });
  document.querySelectorAll('#panel-usda .u-crop').forEach(function (p) {
    p.classList.toggle('active', p.dataset.crop === crop);
  });
  usdaDrawCropCharts(crop);
  // El grafico de condicion sigue al cultivo elegido arriba. El girasol no
  // tiene datos de NASS, asi que en ese caso se deja el que estaba.
  if (USDA_DATA.condicion && USDA_DATA.condicion[crop] && crop !== _usdaCondCrop) {
    usdaSetCondCrop(crop);
  }
}

function usdaDrawConditionCharts() {

  if (!cond || typeof Chart === 'undefined') return;

        responsive: true, maintainAspectRatio: false,

        plugins: {
          legend: { labels: { boxWidth: 12, font: { size: 11 } } },
          tooltip: {
            callbacks: {
              title: function (items) { return 'Semana ' + items[0].label.slice(1); },
              label: function (x) { return x.dataset.label + ': ' + (x.parsed.y === null ? '—' : x.parsed.y + '% B/E'); }
            }
          }
        },
        scales: {
          x: { title: { display: true, text: 'Semana del año', font: { size: 10 } }, ticks: { font: { size: 9 } }, grid: { display: false } },

          }),
          borderRadius: 2
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,

var _ensoCrop = 'soja';

function _ensoNivelVigente() {

    oni = vivo.ultimo.valor; per = vivo.ultimo.periodo;
    if (vivo.roni) { roni = vivo.roni.valor; perR = vivo.roni.periodo; }
  }

    oni = m.actual.oni.valor; per = m.actual.oni.periodo;
  }

// ── Argentina — ECC de la Bolsa de Cereales ───────────────────────────
// El bloque ECC_DATA lo regenera la tarea semanal "ecc-bolsa-cereales".

// El maíz va separado en temprano y tardío porque transitan el llenado en
// momentos distintos: promediarlos tapa la señal. La soja va agregada.
var ECC_NOMBRES = {
  trigo: '🌾 Trigo',
  maiz_temprano: '🌽 Maíz temprano',
  maiz_tardio: '🌽 Maíz tardío',
  soja: '🫘 Soja'
};
var ECC_ORDEN = ['trigo', 'maiz_temprano', 'maiz_tardio', 'soja'];

function _eccPct(v, dec) {
  if (v === null || v === undefined) return '—';
  return v.toFixed(dec === undefined ? 0 : dec) + '%';
}

function _eccDelta(actual, ref) {
  // Solo tiene sentido en condición: en siembra y cosecha estar arriba o
  // abajo del promedio no es mejor ni peor, es ritmo de trabajo.
  if (actual === null || actual === undefined || ref === null || ref === undefined) return '';
  var d = actual - ref;
  if (Math.abs(d) < 0.5) return '';
  return ' <span class="ecc-d ' + (d > 0 ? 'up' : 'down') + '">' +
    (d > 0 ? '+' : '') + d.toFixed(0) + '</span>';
}

function _eccEtapa(d) {
  // De siembra y cosecha se muestra una sola: la que se movió en la semana.
  // Cuál se mueve dice en qué etapa está el cultivo, que es la lectura útil;
  // mostrar las dos ocupa el doble y una siempre está clavada en 0 o en 100.
  var s = d.siembra, c = d.cosecha;
  function mov(v) {
    if (!v || v.actual === null || v.semana_previa === null) return 0;
    return Math.abs(v.actual - v.semana_previa);
  }
  var ms = mov(s), mc = mov(c);
  if (mc > ms) return ['cosecha', 'Cosecha'];
  if (ms > mc) return ['siembra', 'Siembra'];
  // Ninguna se movió: se muestra la que está en curso, y si ninguna lo está,
  // la que viene (cosecha si ya terminó de sembrarse).
  function enCurso(v) { return v && v.actual > 0 && v.actual < 100; }
  if (enCurso(c)) return ['cosecha', 'Cosecha'];
  if (enCurso(s)) return ['siembra', 'Siembra'];
  return (s && s.actual === 100) ? ['cosecha', 'Cosecha'] : ['siembra', 'Siembra'];
}

var _eccCrop = 'trigo';

function eccSetCrop(c) {
  _eccCrop = c;
  document.querySelectorAll('#panel-usda .u-eccbtn').forEach(function (b) {
    b.classList.toggle('active', b.dataset.crop === c);
  });

function _eccOrden(semanas, valores) {
  // Mismo criterio que el extractor. La campaña cruza el fin de año, así que
  // el número de semana no da el orden. La cosecha sí: dentro de una campaña
  // solo puede subir, y donde cae de golpe está el corte. El hueco entre
  // semanas queda de respaldo para cuando todavía no hay cosecha informada.
  var s = semanas.map(Number).sort(function (a, b) { return a - b; });
  if (s.length < 2) return s;

  if (valores) {
    var cos = s.map(function (w) {
      var f = valores[String(w)];
      return f ? f[2] : null;
    });
    if (cos.some(function (v) { return v; })) {
      var peor = 0, ci = -1;
      for (var k = 0; k < s.length; k++) {
        var a = cos[k], b = cos[(k + 1) % s.length];
        if (a !== null && b !== null && a - b > peor) { peor = a - b; ci = k; }
      }
      if (peor > 20) return s.slice(ci + 1).concat(s.slice(0, ci + 1));
    }
  }

  var mejor = 0, corte = s.length - 1;
  for (var i = 0; i < s.length - 1; i++) {
    if (s[i + 1] - s[i] > mejor) { mejor = s[i + 1] - s[i]; corte = i; }
  }
  if (s[0] + 53 - s[s.length - 1] > mejor) corte = s.length - 1;
  return s.slice(corte + 1).concat(s.slice(0, corte + 1));
}

function eccDrawChart() {
  if (typeof ECC_DATA === 'undefined' || !ECC_DATA.hist || typeof Chart === 'undefined') return;
  var H = ECC_DATA.hist[_eccCrop];
  var info = ECC_DATA.cultivos[_eccCrop];
  if (!H || !info) return;

  var anio = function (c) { return parseInt(String(c).split('/')[0], 10); };
  var vig = info.campania;
  var prevs = Object.keys(H).filter(function (c) { return anio(c) < anio(vig); })
    .sort(function (a, b) { return anio(b) - anio(a); });

  // Eje: las semanas de la campaña previa (que está completa) más las que ya
  // tenga la vigente, en orden cronológico.
  // El eje sale de la campaña previa, que está completa y da el ciclo entero;
  // la vigente solo aporta las semanas que ya lleva.
  var base = prevs[0] || vig;
  var eje = _eccOrden(Object.keys(H[base]), H[base]);
  var enEje = {};
  eje.forEach(function (s) { enEje[s] = 1; });
  _eccOrden(Object.keys(H[vig]), H[vig]).forEach(function (s) {
    if (!enEje[s]) { eje.push(s); enEje[s] = 1; }
  });

  var serie = function (camp) {
    return eje.map(function (s) {
      var f = H[camp] && H[camp][String(s)];
      return f ? f[0] : null;
    });
  };
  var promedio = eje.map(function (s) {
    var vals = prevs.map(function (c) {
      var f = H[c] && H[c][String(s)];
      return f ? f[0] : null;
    }).filter(function (v) { return v !== null && v !== undefined; });
    return vals.length ? Math.round(vals.reduce(function (a, b) { return a + b; }, 0) / vals.length * 10) / 10 : null;
  });

  var id = 'u-chart-ecc';
  var cv = document.getElementById(id);
  if (!cv) return;
  _uDestroy(id);

  var ds = [{
    label: vig + ' (en curso)', data: serie(vig),
    borderColor: '#1a1a2e', backgroundColor: 'rgba(26,26,46,0.06)',
    borderWidth: 3, pointRadius: 3, tension: 0.3, fill: true, order: 1, spanGaps: true
  }];
  var colores = ['#4fc3b5', '#b9bfc9'];
  prevs.slice(0, 2).forEach(function (c, i) {
    ds.push({
      label: c, data: serie(c), borderColor: colores[i], borderWidth: 2,
      pointRadius: 0, tension: 0.3, fill: false, order: 3, spanGaps: true
    });
  });
  ds.push({
    label: 'Promedio ' + prevs.length + ' campañas', data: promedio,
    borderColor: '#d97706', borderWidth: 2, borderDash: [6, 4],
    pointRadius: 0, tension: 0.3, fill: false, order: 2, spanGaps: true
  });

  _usdaCharts[id] = new Chart(cv.getContext('2d'), {
    type: 'line',
    data: { labels: eje.map(function (s) { return 'S' + s; }), datasets: ds },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { labels: { boxWidth: 12, font: { size: 11 } } } },
      scales: {
        x: { title: { display: true, text: 'Semana del año', font: { size: 10 } },
             ticks: { font: { size: 9 } }, grid: { display: false } },
        y: { title: { display: true, text: '% bueno + excelente', font: { size: 10 } },
             ticks: { font: { size: 10 }, callback: function (v) { return v + '%'; } } }
      }
    }
  });
}

function decodeLecap(ticker){
  const tipo=ticker[0]==='S'?'LECAP':ticker[0]==='X'?'BONCAP':'Letra';
  const day=parseInt(ticker.substring(1,3));
  const mc=ticker[3];
  const yr=parseInt(ticker[4]);
  const m=LECAP_MONTH[mc];
  if(!m||isNaN(day)||isNaN(yr))return null;
  const year=2020+yr;
  const venc=new Date(year,m-1,day);
  const today=new Date();today.setHours(0,0,0,0);
  const dias=Math.round((venc-today)/(86400000));
  const display=`${day} ${LECAP_MES[m]} ${year}`;
  return{tipo,venc,dias,display,month:m,year};
}

function parseCSV(text){
  const lines=text.trim().split(/\r?\n/);
  if(!lines.length)return{headers:[],rows:[]};
  const parse=line=>{const cols=[];let cur='',inQ=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}else if(c===','&&!inQ){cols.push(cur.trim());cur='';}else cur+=c;}cols.push(cur.trim());return cols;};
  const headers=parse(lines[0]).map(h=>h.replace(/^"|"$/g,'').trim());
  return{headers,rows:lines.slice(1).map(l=>parse(l)).filter(r=>r.length>=headers.length&&r.some(c=>c))};
}

function findCol(headers,...candidates){
  for(const c of candidates){
    const i=headers.findIndex(h=>h.toLowerCase().includes(c.toLowerCase()));
    if(i>=0)return i;
  }
  return -1;
}

// Parsea la hoja LECAP: tabla de 2 columnas (TICKER | PRECIO).
function parseMdLecaps(text){
  const lines=text.split('\n');
  const TICKER_RE=/^[A-Z][A-Z0-9]{4}$/;
  const seen=new Map();
  for(const line of lines){
    const l=line.trim();
    if(!l.startsWith('|'))continue;
    if(/^[|:\s\-]+$/.test(l))continue;
    const cells=l.replace(/^\||\|$/g,'').split('|').map(c=>c.replace(/\\/g,'').trim());
    if(cells.length!==2)continue;
    const ticker=cells[0].toUpperCase();
    const rawPrice=cells[1];
    if(!TICKER_RE.test(ticker))continue;
    if(rawPrice==='#N/A'||rawPrice==='N/A'||rawPrice==='')continue;
    const price=parseFloat(rawPrice.replace(/,/g,'.'));
    if(isNaN(price)||price<=0)continue;
    if(!seen.has(ticker))seen.set(ticker,String(price));
  }
  if(seen.size===0)return null;
  const rows=[...seen.entries()].map(([t,p])=>[t,p,'0']);
  return{headers:['ticker','precio','var'],rows};
}

function extractText(res){
  if(!res)return null;
  if(typeof res==='string')return res;
  if(Array.isArray(res)){
    return res.filter(b=>b.type==='text'||typeof b.text==='string').map(b=>b.text||b).join('');
  }
  if(res.content){
    if(typeof res.content==='string')return res.content;
    if(Array.isArray(res.content))return res.content.filter(b=>b.type==='text'||typeof b.text==='string').map(b=>b.text||b).join('');
  }
  if(res.text)return res.text;
  if(res.body)return res.body;
  return JSON.stringify(res);
}

function calcYields(pa,pf,dias){
  if(!pf||!pa||dias<=0)return{rend:null,tna:null,tem:null,tea:null};
  const ratio=pf/pa;
  const rend=(ratio-1)*100;
  const tna=(ratio-1)*(365/dias)*100;
  const tem=(Math.pow(ratio,30/dias)-1)*100;
  const tea=(Math.pow(ratio,365/dias)-1)*100;
  return{rend,tna,tem,tea};
}

function tnaColor(tna){
  if(tna===null)return'#888';
  if(tna>=50)return'#1e7e34';
  if(tna>=35)return'#2e7d32';
  if(tna>=25)return'#b45309';
  return'#cb2431';
}

  if(tna>=35)return'#f0faf0';

}

let _finCultivo='soj';

  const FIN_TARGET_VENC={soj:['SEP26','NOV26','ENE27'],mai:['SEP26','DIC26','ENE27'],tri:['SEP26','NOV26','ENE27']};
  function _finPickVenc(futs,cultKey){
  const targets=FIN_TARGET_VENC[cultKey]||[];
  const picked=targets.map(v=>(futs||[]).find(r=>r.venc_display===v&&r.ajuste&&r.ajuste!=='N/A'&&!isNaN(parseFloat(r.ajuste)))).filter(Boolean);
  return picked.length?picked:sortByVenc((futs||[]).filter(r=>r.ajuste&&r.ajuste!=='N/A'&&!isNaN(parseFloat(r.ajuste)))).slice(0,3);
  }

function _finSetCultivo(c){_finCultivo=c;buildFinanciamientoPanel();}
function _finSetTNA(v){const n=parseFloat(String(v).replace(',','.'));if(!isNaN(n)&&n>0){_finTNA=n;buildFinanciamientoPanel();}}
function _finSetVA(c,v){
  const raw=String(v||'').replace(/\s/g,'').replace(/\./g,'').replace(',','.');
  const n=parseFloat(raw);
  _finVA[c]=(!v||v===''||isNaN(n)||n<=0)?null:n;
  buildFinanciamientoPanel();
}
function _finSetModo(m){_finModo=m;buildFinanciamientoPanel();}
function _finSetTasaUsd(v){const n=parseFloat(String(v).replace(',','.'));if(!isNaN(n)&&n>=0){_finTasaUsd=n;buildFinanciamientoPanel();}}
function _finGetVA(cult){
  if(_finVA[cult])return _finVA[cult];
  const panelId=cult+'-fut';
  const customArs=window._customSpotArs&&window._customSpotArs[panelId];
  if(customArs)return customArs;
  const cultKey=cult==='soj'?'soja':cult==='mai'?'maiz':'trigo';
  return SPOT?SPOT[cultKey+'_ars']:null;
}
function _finGetVAUsd(cult){
  const cultKey=cult==='soj'?'soja':cult==='mai'?'maiz':'trigo';
  const panelId=cult+'-fut';
  const customArs=window._customSpotArs&&window._customSpotArs[panelId];
  if(customArs&&SPOT&&SPOT.tc)return customArs/SPOT.tc;
  if(!SPOT)return null;
  return (SPOT.tc&&SPOT[cultKey+'_ars'])?SPOT[cultKey+'_ars']/SPOT.tc:SPOT[cultKey+'_usd'];
}
function _finFindDollarFut(vencDisplay){
  // Match exacto por mes/año: JUL26 → 07/2026, SEP26 → 09/2026, etc.
  if(!DLR_FUT||!DLR_FUT.length)return null;
  const mmap={ENE:'01',FEB:'02',MAR:'03',ABR:'04',MAY:'05',JUN:'06',JUL:'07',AGO:'08',SEP:'09',OCT:'10',NOV:'11',DIC:'12'};
  const m=vencDisplay.match(/^([A-Z]{3})(\d{2})$/);
  if(!m)return null;
  const mon=mmap[m[1]];const yr='20'+m[2];
  if(!mon)return null;
  const target=mon+'/'+yr; // ej: "07/2026"
  return DLR_FUT.find(r=>r.venc_display===target&&r.ajuste&&r.ajuste!=='N/A'&&!isNaN(parseFloat(r.ajuste)))||null;
}
function buildFinanciamientoPanel(){
  const panel=document.getElementById('panel-financiamiento');if(!panel)return;

    const lbl=m==='pesos'?'\ud83d\udcb5 Pesos':'\ud83d\udcb2 D\u00f3lar';

    return `<button onclick="_finSetModo('${m}')" style="padding:8px 22px;border:2px solid ${act?'#16213e':'#dde'};border-radius:8px;font-size:0.85rem;font-weight:700;cursor:pointer;background:${act?'#16213e':'white'};color:${act?'white':'#555'};transition:all 0.15s">${lbl}</button>`;

  if(_finModo==='dolar'){
    if(finChart){finChart.destroy();finChart=null;}
    buildFinanciamientoDolar(panel,modoBtns);

  }
  buildFinanciamientoPesos(panel,modoBtns);
}

function buildFinanciamientoDolar(panel,modoBtnsHtml){
  const fmtUSD=n=>n!=null?n.toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2}):'\u2014';

    const cards=validFuts.map(f=>{
      const vencDate=VENC_DATES[f.venc_display];
      const dias=vencDate?Math.round((vencDate-today)/(1000*60*60*24)):null;
      const futUsd=parseFloat(f.ajuste);
      const diffUsd=(dispUsd!=null&&futUsd!=null)?(futUsd-dispUsd):null;
      const pasePct=(dispUsd&&futUsd&&dispUsd>0)?((futUsd/dispUsd-1)*100):null;
      const tnaPase=(pasePct!=null&&dias!=null&&dias>0)?(pasePct*365/dias):null;
      const conviene=(tnaPase!=null)?(tnaPase>_finTasaUsd):null;
      const cardClass=conviene===null?'fin-venc-card':conviene?'fin-venc-card conviene':'fin-venc-card no-conviene';
      const badge=conviene===null?'<span style="color:#aaa;font-size:0.82rem">Sin datos suficientes</span>':
        conviene?'<span class="fin-badge-conv">\ud83c\udfe6 Conviene retener y financiarse</span>':
                 '<span class="fin-badge-noconv">\ud83d\udce4 Conviene vender</span>';
      const fechaStr=vencDate?vencDate.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'}):'\u2014';
      const diffTna=tnaPase!=null?(tnaPase-_finTasaUsd):null;
      const costoDirPct=(dias!=null&&dias>0)?(_finTasaUsd*dias/365):null;
      const costoDirUsd=(costoDirPct!=null&&dispUsd!=null)?(dispUsd*costoDirPct/100):null;
      const netoUsd=(diffUsd!=null&&costoDirUsd!=null)?(diffUsd-costoDirUsd):null;
      const netoPct=(pasePct!=null&&costoDirPct!=null)?(pasePct-costoDirPct):null;
      const rowPair=(labelDir,valDir,labelTna,valTna)=>`<div style="display:flex;justify-content:space-between;gap:8px;font-size:0.78rem"><span style="color:#888">${labelDir}</span><span style="font-weight:700">${valDir}</span></div><div style="display:flex;justify-content:space-between;gap:8px;font-size:0.72rem;color:#aaa;margin-bottom:6px"><span>${labelTna}</span><span>${valTna}</span></div>`;
      return `<div class="${cardClass}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div style="font-size:1.15rem;font-weight:900;color:${cv.color}">${f.venc_display}</div>

        <div class="fin-row"><span class="fin-label">Futuro ${cv.label}</span><span class="fin-val">USD ${fmtUSD(futUsd)}/tn</span></div>
        <div style="border-top:1px solid #f0f2f5;margin-top:8px;padding-top:8px">
          <div style="font-size:0.7rem;font-weight:800;color:#555;text-transform:uppercase;letter-spacing:0.3px;margin-bottom:4px">Ganancia/p\u00e9rdida del pase</div>
          ${rowPair('Directo (por '+(dias!=null?dias+'d':'\u2014')+')',diffUsd!=null?(diffUsd>=0?'+':'')+'USD '+fmtUSD(diffUsd)+'/tn ('+(pasePct>=0?'+':'')+pasePct.toFixed(2)+'%)':'\u2014','TNA',tnaPase!=null?(tnaPase>=0?'+':'')+tnaPase.toFixed(1)+'%':'\u2014')}
        </div>
        <div style="border-top:1px solid #f0f2f5;padding-top:8px">
          <div style="font-size:0.7rem;font-weight:800;color:#555;text-transform:uppercase;letter-spacing:0.3px;margin-bottom:4px">Costo de financiamiento</div>
          ${rowPair('Directo (por '+(dias!=null?dias+'d':'\u2014')+')',costoDirUsd!=null?'USD '+fmtUSD(costoDirUsd)+'/tn ('+costoDirPct.toFixed(2)+'%)':'\u2014','TNA',_finTasaUsd.toFixed(1)+'%')}
        </div>
        <div style="border-top:1px solid #f0f2f5;padding-top:8px">
          <div style="font-size:0.7rem;font-weight:800;color:#555;text-transform:uppercase;letter-spacing:0.3px;margin-bottom:4px">Resultado neto (pase \u2212 financiamiento)</div>
          <div style="display:flex;justify-content:space-between;gap:8px"><span style="font-size:0.85rem;color:#666">Directo</span><span style="font-size:0.95rem;font-weight:800;color:${netoUsd!=null&&netoUsd>=0?'#166534':'#991b1b'}">${netoUsd!=null?(netoUsd>=0?'+':'')+'USD '+fmtUSD(netoUsd)+'/tn':'\u2014'}${netoPct!=null?' ('+(netoPct>=0?'+':'')+netoPct.toFixed(2)+'%)':''}</span></div>
          <div style="display:flex;justify-content:space-between;gap:8px;margin-top:2px"><span style="font-size:0.78rem;color:#888">TNA</span><span style="font-size:0.85rem;font-weight:700;color:${diffTna!=null&&diffTna>=0?'#166534':'#991b1b'}">${diffTna!=null?(diffTna>=0?'+':'')+diffTna.toFixed(1)+'pp':'\u2014'}</span></div>
        </div>
        <div style="border-top:1px solid #f0f2f5;margin-top:8px;padding-top:10px">
          ${badge}
        </div>
      </div>`;
    }).join('');
    return `<div style="margin-bottom:22px">
      <div style="font-size:0.85rem;font-weight:800;color:${cv.color};text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px">${cv.icon} ${cv.label}</div>
      <div class="fin-venc-grid">${cards}</div>
    </div>`;
  }).join('');

  panel.innerHTML=`
    <div style="display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap">${modoBtnsHtml}</div>
    <div class="fin-card" style="margin-bottom:18px">
      <div style="font-size:0.8rem;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:14px">\u2699\ufe0f Par\u00e1metros</div>
      <div style="display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end">
        <div style="display:flex;flex-direction:column;gap:6px">
          <label style="font-size:0.7rem;font-weight:700;color:#666;text-transform:uppercase;letter-spacing:0.4px">Tasa de financiamiento USD</label>
          <div style="display:flex;align-items:center;gap:6px">
            <input type="number" id="fin-tasa-usd" value="${_finTasaUsd}" min="0" max="100" step="0.5"
              style="padding:7px 12px;border:1.5px solid #dde;border-radius:8px;font-size:0.9rem;font-weight:700;color:#1a1a2e;width:85px;outline:none"
              onkeydown="if(event.key==='Enter'){_finSetTasaUsd(this.value);this.blur();}"
              onblur="_finSetTasaUsd(this.value)">
            <span style="color:#888;font-size:0.85rem">% TNA</span>
          </div>
        </div>
        <div style="font-size:0.72rem;color:#bbb;padding-bottom:8px;font-style:italic">TNA pase = ((Futuro/Disponible) \u2212 1) \u00d7 365/d\u00edas</div>
      </div>
    </div>
    ${sections}`;
}

function buildFinanciamientoPesos(panel,modoBtnsHtml){
  const cult=_finCultivo;
  const cultLabel=cult==='soj'?'Soja':cult==='mai'?'Maíz':'Trigo';
  const cultColor=cult==='soj'?'#2e7d32':cult==='mai'?'#e65100':'#1565c0';
  const futs=cult==='soj'?SOJ_FUT:cult==='mai'?MAI_FUT:TRI_FUT;
  if(!futs||!futs.length){panel.innerHTML='<div style="padding:48px;text-align:center;color:#aaa;font-size:0.9rem">Sin datos de futuros. Actualizá los datos primero.</div>';return;}
  const va=_finGetVA(cult);
  const isVAManual=!!_finVA[cult];
  const isVAFromAcopio=!isVAManual&&!!(window._customSpotArs&&window._customSpotArs[cult+'-fut']);
  const vaDisplay=va?va.toLocaleString('es-AR',{maximumFractionDigits:0}):'';
  const tna=_finTNA/100;
  const today=new Date();
  const fmtARS=n=>n!=null?n.toLocaleString('es-AR',{minimumFractionDigits:0,maximumFractionDigits:0}):'—';
  const fmtUSD=n=>n!=null?n.toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2}):'—';
  // 3 próximos vencimientos válidos
  const validFuts=_finPickVenc(futs,cult);
  const cards=validFuts.map(f=>{
    const vencDate=VENC_DATES[f.venc_display];
    const dias=vencDate?Math.round((vencDate-today)/(1000*60*60*24)):null;
    const vtoAnios=dias!=null?dias/365:null;
    const vn=(va!=null&&dias!=null)?va*(1+tna*dias/365):null;
    const dlrFut=_finFindDollarFut(f.venc_display);
    const futPriceUsd=parseFloat(f.ajuste);
    const dlrPrice=dlrFut?parseFloat(dlrFut.ajuste):null;
    const resultado=(futPriceUsd&&dlrPrice)?futPriceUsd*dlrPrice:null;
    const conviene=(resultado!=null&&vn!=null)?(resultado>=vn):null;
    const diferencia=(resultado!=null&&vn!=null)?resultado-vn:null;
    const ratio=(resultado!=null&&vn!=null)?(resultado/vn*100):null;
    const cardClass=conviene===null?'fin-venc-card':conviene?'fin-venc-card conviene':'fin-venc-card no-conviene';
    const badge=conviene===null?'<span style="color:#aaa;font-size:0.82rem">Sin datos suficientes</span>':
      conviene?'<span class="fin-badge-conv">🏦 Conviene retener y financiarse</span>':
               '<span class="fin-badge-noconv">📤 Conviene vender</span>';
    const difHtml=diferencia!=null?`<div style="display:flex;justify-content:space-between;margin-top:4px">
      <span style="font-size:0.85rem;font-weight:800;color:${conviene?'#166534':'#991b1b'}">${diferencia>=0?'+':''}$${fmtARS(diferencia)}/tn</span>
      <span style="font-size:0.82rem;font-weight:700;color:${conviene?'#166534':'#991b1b'}">${ratio?(ratio-100>=0?'+':'')+(ratio-100).toFixed(1)+'%':''}</span>
    </div>`:'';
    const fechaStr=vencDate?vencDate.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'}):'—';
    return `<div class="${cardClass}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div style="font-size:1.15rem;font-weight:900;color:${cultColor}">${f.venc_display}</div>
        <div style="text-align:right"><div style="font-size:0.7rem;color:#aaa">Vto: ${fechaStr}</div><div style="font-size:0.7rem;color:#aaa">${dias!=null?dias+' días':''}</div></div>
      </div>
      <div class="fin-section-title">📄 Costo de financiamiento</div>
      <div class="fin-row"><span class="fin-label">Precio disponible (VA)</span><span class="fin-val">${va?'$'+fmtARS(va):'—'}</span></div>
      <div class="fin-row"><span class="fin-label">TNA · días · años</span><span class="fin-val">${_finTNA}% · ${dias!=null?dias:'—'}d · ${vtoAnios!=null?vtoAnios.toFixed(3):'—'}</span></div>
      <div class="fin-total-row"><span style="font-size:0.8rem;font-weight:700;color:#555">VN del cheque</span><span style="font-size:1rem;font-weight:800;color:#1a1a2e">${vn?'$'+fmtARS(vn):'—'}</span></div>
      <div class="fin-section-title" style="margin-top:6px">📈 Futuro ${cultLabel} × Futuro Dólar</div>
      <div class="fin-row"><span class="fin-label">Futuro ${cultLabel}</span><span class="fin-val">USD ${fmtUSD(futPriceUsd)}/tn</span></div>
      <div class="fin-row"><span class="fin-label">Futuro Dólar ${dlrFut?'('+dlrFut.venc_display+')':''}</span><span class="fin-val">${dlrPrice?'$'+fmtARS(dlrPrice)+'/USD':'—'}</span></div>
      <div class="fin-total-row" style="background:#eff6ff;"><span style="font-size:0.8rem;font-weight:700;color:#1e40af">Resultado futuros</span><span style="font-size:1rem;font-weight:800;color:#1e40af">${resultado?'$'+fmtARS(resultado):'—'}</span></div>
      <div style="border-top:1px solid #f0f2f5;margin-top:4px;padding-top:10px">
        ${badge}${difHtml}
      </div>
    </div>`;
  });
  const cultBtns=['soj','mai','tri'].map(c=>{
    const lbl=c==='soj'?'🌱 Soja':c==='mai'?'🌽 Maíz':'🌾 Trigo';
    const act=c===cult;
    const cc=c==='soj'?'#2e7d32':c==='mai'?'#e65100':'#1565c0';
    return `<button onclick="_finSetCultivo('${c}')" style="padding:8px 22px;border:2px solid ${act?cc:'#dde'};border-radius:8px;font-size:0.85rem;font-weight:700;cursor:pointer;background:${act?cc:'white'};color:${act?'white':'#555'};transition:all 0.15s">${lbl}</button>`;
  }).join('');
  const vaBadge=isVAManual?'<span style="font-size:0.65rem;background:#f59e0b;color:#1a1a2e;padding:1px 7px;border-radius:3px;font-weight:800;margin-left:6px">MANUAL</span>':
    isVAFromAcopio?'<span style="font-size:0.65rem;background:#6366f1;color:white;padding:1px 7px;border-radius:3px;font-weight:700;margin-left:6px">desde acopio</span>':
    '<span style="font-size:0.65rem;color:#aaa;margin-left:5px">mercado</span>';
  const vaClearBtn=isVAManual?`<button onclick="_finVA['${cult}']=null;buildFinanciamientoPanel()" style="background:none;border:none;color:#f59e0b;cursor:pointer;font-size:0.78rem;font-weight:700;padding:0 4px">✕ auto</button>`:'';
  panel.innerHTML=`
    <div style="display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap">${modoBtnsHtml}</div>
    <div style="display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap">${cultBtns}</div>
    <div class="fin-card" style="margin-bottom:4px">
      <div style="font-size:0.8rem;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:14px">⚙️ Parámetros</div>
      <div style="display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end">
        <div style="display:flex;flex-direction:column;gap:6px">
          <label style="font-size:0.7rem;font-weight:700;color:#666;text-transform:uppercase;letter-spacing:0.4px">VA – Precio disponible ARS/tn ${vaBadge}</label>
          <div style="display:flex;align-items:center;gap:6px">
            <span style="color:#888;font-size:0.9rem">$</span>
            <input type="text" id="fin-va-${cult}" value="${vaDisplay}" placeholder="ej: 465.000"
              style="padding:7px 12px;border:1.5px solid ${isVAManual?'#f59e0b':'#dde'};border-radius:8px;font-size:0.9rem;font-weight:700;color:#1a1a2e;width:155px;outline:none;background:${isVAManual?'#fffbeb':'white'}"
              onkeydown="if(event.key==='Enter'){_finSetVA('${cult}',this.value);this.blur();}"
              onblur="_finSetVA('${cult}',this.value)">
            ${vaClearBtn}
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px">
          <label style="font-size:0.7rem;font-weight:700;color:#666;text-transform:uppercase;letter-spacing:0.4px">Tasa TNA</label>
          <div style="display:flex;align-items:center;gap:6px">
            <input type="number" id="fin-tna" value="${_finTNA}" min="1" max="300" step="0.5"
              style="padding:7px 12px;border:1.5px solid #dde;border-radius:8px;font-size:0.9rem;font-weight:700;color:#1a1a2e;width:85px;outline:none"
              onkeydown="if(event.key==='Enter'){_finSetTNA(this.value);this.blur();}"
              onblur="_finSetTNA(this.value)">
            <span style="color:#888;font-size:0.85rem">% TNA</span>
          </div>
        </div>
        <div style="font-size:0.72rem;color:#bbb;padding-bottom:8px;font-style:italic">VN = VA × (1 + TNA × días/365)</div>
      </div>
    </div>
    <div class="fin-venc-grid">${cards.join('')}</div>
    <div class="fin-card" style="margin-top:18px">
      <div class="fin-section-title" style="margin-bottom:10px">📊 Comparativo por mes: VN del cheque vs. Resultado futuros</div>
      <div class="canvas-wrap" style="height:280px"><canvas id="fin-comparison-chart"></canvas></div>
    </div>`;

  setTimeout(()=>{
    if(finChart){finChart.destroy();finChart=null;}
    const ctx=document.getElementById('fin-comparison-chart');
    if(!ctx||!validFuts.length)return;
    const labels=validFuts.map(f=>f.venc_display);
    const vnData=validFuts.map(f=>{
      const vencDate=VENC_DATES[f.venc_display];
      const dias=vencDate?Math.round((vencDate-today)/(1000*60*60*24)):null;
      return (va!=null&&dias!=null)?va*(1+tna*dias/365):null;
    });
    const resData=validFuts.map(f=>{
      const dlrFut=_finFindDollarFut(f.venc_display);
      const futPriceUsd=parseFloat(f.ajuste);
      const dlrPrice=dlrFut?parseFloat(dlrFut.ajuste):null;
      return (futPriceUsd&&dlrPrice)?futPriceUsd*dlrPrice:null;
    });
    finChart=new Chart(ctx,{
      type:'bar',
      data:{
        labels:labels,
        datasets:[
          {label:'VN del cheque',data:vnData,backgroundColor:'#1a1a2e99',borderRadius:4},
          {label:'Resultado futuros',data:resData,backgroundColor:'#1e40af99',borderRadius:4}
        ]
      },
      options:{
        responsive:true,maintainAspectRatio:false,
        plugins:{
          legend:{display:true,position:'top',labels:{font:{size:11}}},
          tooltip:{callbacks:{
            label:item=>`${item.dataset.label}: ${item.raw?item.raw.toLocaleString('es-AR',{maximumFractionDigits:0}):'—'}`
          }}
        },
        scales:{
          x:{grid:{display:false},ticks:{font:{size:11,weight:'700'}}},
          y:{min:(cult==='soj'?200000:100000),title:{display:true,text:'ARS/tn',font:{size:11}},grid:{color:'#f0f2f5'},ticks:{font:{size:11},callback:v=>v.toLocaleString('es-AR',{maximumFractionDigits:0})}}
        }
      }
    });
  },50);
}

  el.id='splash-overlay';

        <div class="sb-icon">📱</div>
        <div class="sb-label">Celular</div>
        <div class="sb-desc"></div>
      </div>
      <div class="splash-btn" onclick="chooseDevice('desktop')">
        <div class="sb-icon">💻</div>
        <div class="sb-label">Computadora</div>
        <div class="sb-desc"></div>
      </div>
    </div>
    <div class="splash-note">Tu preferencia se recordará para la próxima vez · <span style="cursor:pointer;text-decoration:underline;color:rgba(0,0,0,0.4)" onclick="localStorage.removeItem('a3_device_mode')">olvidar preferencia</span></div>

}
window.chooseDevice=function(mode){
  localStorage.setItem('a3_device_mode',mode);
  window.a3DeviceMode=mode;
  document.getElementById('splash-overlay')?.remove();
  loadAndInitA3();
};
window._initDeviceFlow=function(){
  window.a3DeviceMode=localStorage.getItem('a3_device_mode');
  if(window.a3DeviceMode){loadAndInitA3();}else{showSplash();}
};

let newsCurrentFilter = 'todos';

function newsSetFilter(crop) {
  newsCurrentFilter = crop;
  ['todos','trigo','maiz','soja'].forEach(function(c) {
    var el = document.getElementById('nchip-' + c);
    if (el) el.classList.toggle('active', c === crop);
  });
  newsRender();
}

function newsRender() {
  var container = document.getElementById('news-container');
  if (!container) return;
  var countEl = document.getElementById('news-filter-count');
  var cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - 7);

  var items = NEWS_DATA.filter(function(n) {
    var d = new Date(n.fecha);
    if (d < cutoff) return false;
    if (newsCurrentFilter === 'todos') return true;
    return n.cultivo.toLowerCase().indexOf(newsCurrentFilter) >= 0;
  });

  if (countEl) countEl.textContent = items.length + ' nota' + (items.length !== 1 ? 's' : '');

  if (items.length === 0) {
    container.innerHTML = '<div class="news-empty"><div class="icon">🌿</div><p>No hay noticias para el filtro seleccionado.</p></div>';
    return;
  }

  var html = '<div class="news-list">';
  var lastDate = '';

  items.forEach(function(n) {
    var colorClass = n.cultivo.indexOf('/') >= 0 ? 'c-multi'
      : n.cultivo.toLowerCase().indexOf('trigo') >= 0 ? 'c-trigo'
      : (n.cultivo.toLowerCase().indexOf('maíz') >= 0 || n.cultivo.toLowerCase().indexOf('maiz') >= 0) ? 'c-maiz'
      : n.cultivo.toLowerCase().indexOf('soja') >= 0 ? 'c-soja' : '';

    var tagClass = n.cultivo.indexOf('/') >= 0 ? 'ntag-multi'
      : n.cultivo.toLowerCase().indexOf('trigo') >= 0 ? 'ntag-trigo'
      : (n.cultivo.toLowerCase().indexOf('maíz') >= 0 || n.cultivo.toLowerCase().indexOf('maiz') >= 0) ? 'ntag-maiz'
      : n.cultivo.toLowerCase().indexOf('soja') >= 0 ? 'ntag-soja' : 'ntag-gen';

    var daysAgo = Math.floor((new Date() - new Date(n.fecha)) / 86400000);
    var age = daysAgo === 0 ? 'Hoy' : daysAgo === 1 ? 'Ayer' : 'Hace ' + daysAgo + ' días';
    var isFresh = daysAgo <= 1;

    if (n.fecha !== lastDate) {
      var label = daysAgo === 0 ? 'Hoy' : daysAgo === 1 ? 'Ayer'
        : new Date(n.fecha + 'T00:00:00').toLocaleDateString('es-AR', {weekday:'long', day:'numeric', month:'long'});
      html += '<div class="date-divider">' + label + '</div>';
      lastDate = n.fecha;
    }

    var resumen = n.resumen.length > 220 ? n.resumen.slice(0, 220).replace(/\s\S+$/, '') + '…' : n.resumen;

    html += '<div class="news-card ' + colorClass + '">'
      + '<div class="card-meta">'
      + '<span style="font-size:0.72rem;color:#999">' + n.fecha + '</span>'
      + '<span class="card-fuente">' + n.fuente + '</span>'
      + '<span class="card-cultivo ' + tagClass + '">' + n.cultivo + '</span>'
      + '<span class="age-badge' + (isFresh ? ' fresh' : '') + '">' + age + '</span>'
      + '</div>'
      + '<div class="card-titulo">' + n.titulo + '</div>'
      + '<div class="card-resumen">' + resumen + '</div>'
      + '<div class="card-footer"><a class="btn-ver-nota" href="' + n.link + '" target="_blank" rel="noopener">Ver nota →</a></div>'
      + '</div>';
  });

  html += '</div>';
  container.innerHTML = html;

  const v1=ins.var1y, v5=ins.var5y;
  const abs1y = ins.last - (ins.last/(1+v1/100));
  const abs5y = ins.last - ins.avg5y;
  document.getElementById('ip-kpis').innerHTML =
      '<div class="kpi"><div class="label">Valor actual</div><div class="value">'+ipFmtNum(ins.last,2)+'</div><div class="sub">'+unit+' / unidad</div></div>'
    + '<div class="kpi '+(v1<0?'green':'red')+'"><div class="label">Var. vs 12 meses</div><div class="value">'+fmtPct(v1)+'</div><div class="sub">'+(abs1y>=0?'+':'')+ipFmtNum(abs1y,2)+' '+unit+'</div></div>'
    + '<div class="kpi '+(v5<0?'green':'red')+'"><div class="label">Var. vs prom. 5 años</div><div class="value">'+fmtPct(v5)+'</div><div class="sub">'+(abs5y>=0?'+':'')+ipFmtNum(abs5y,2)+' '+unit+'</div></div>'
    + '<div class="kpi yellow"><div class="label">Promedio 5 años</div><div class="value">'+ipFmtNum(ins.avg5y,2)+'</div><div class="sub">'+unit+' / unidad</div></div>';
  renderIpRangeBar();
  buildIpLists();
  setTimeout(function(){ drawIpChart(ipCrop, ins); }, 60);
  if(scroll) setTimeout(function(){ document.getElementById('ip-detail').scrollIntoView({behavior:'smooth',block:'nearest'}); },60);
}

function drawIpChart(crop, ins){
  if(ipChart){ ipChart.destroy(); ipChart=null; }
  const series=ins.series||{};
  let entries=Object.entries(series).sort(function(a,b){return a[0].localeCompare(b[0]);});
  if(ipRange>0){
    const cutoff=new Date(); cutoff.setFullYear(cutoff.getFullYear()-ipRange);
    const cutStr=cutoff.toISOString().slice(0,7);
    entries=entries.filter(function(e){return e[0]>=cutStr;});
  }
  if(!entries.length) return;
  const months=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const labels=entries.map(function(e){const p=e[0].split('-');return months[parseInt(p[1])-1]+' '+p[0].slice(2);});
  const values=entries.map(function(e){return e[1];});
  const avg=values.reduce(function(a,b){return a+b;},0)/values.length;
  const ctx=document.getElementById('ip-chart').getContext('2d');
  ipChart=new Chart(ctx,{
    type:'line',
    data:{labels:labels, datasets:[
      {label:ipDisplayName(ins), data:values, borderColor:'#1a1a2e',
        segment:{borderColor:function(c){const mid=(c.p0.parsed.y+c.p1.parsed.y)/2; return mid<=avg?'#1e7e34':'#9b1c1c';}},
        backgroundColor:'rgba(26,26,46,0.05)', borderWidth:2.5, pointRadius:0, pointHoverRadius:4, tension:0.3, fill:false},
      {label:'Prom. período', data:Array(labels.length).fill(avg), borderColor:'#aab', borderWidth:1.5, borderDash:[5,4], pointRadius:0, fill:false}
    ]},
    options:{responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:true,position:'top',labels:{boxWidth:12,font:{size:11},padding:10}},
        tooltip:{callbacks:{label:function(c){return ' '+c.dataset.label+': '+ipFmtNum(c.raw,2);}}}},
      scales:{x:{grid:{display:false},ticks:{font:{size:10},maxTicksLimit:12,maxRotation:0}},
        y:{grid:{color:'#f0f2f5'},ticks:{font:{size:10},callback:function(v){return ipFmtNum(v, v%1===0?0:2);}}}}}
  });
}
