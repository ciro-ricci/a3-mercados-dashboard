name: Actualizar produccion y carry-in (mensual, monitor SIO Granos)

on:
  schedule:
    - cron: '0 12 1 * *'   # dia 1 de cada mes, 09:00 Argentina (UTC-3)
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  update-carryin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Actualizar produccion / carry-in / oferta
        run: python scripts/update_carryin.py

      - name: Verificar que el dato no quedo muy viejo
        run: |
          python3 - <<'EOF'
          import re, sys
          from datetime import datetime, timezone

          MAX_STALE_DAYS = 45  # dato mensual, casi no cambia; damos bastante margen
          today = datetime.now(timezone.utc).date()

          with open("index.html", encoding="utf-8") as f:
              t = f.read()

          m = re.search(r"const CARRYIN_DATA = \{[\s\S]*?soja:\{produccion:([\d.]+)", t)
          if not m:
              print("PROBLEMA: No se encontro CARRYIN_DATA en index.html")
              sys.exit(1)

          # Chequeamos la fecha del ultimo commit que toco este bloque via git log,
          # ya que CARRYIN_DATA no siempre trae una fecha explicita utilizable.
          import subprocess
          log = subprocess.run(
              ["git", "log", "-1", "--format=%ct", "--", "index.html"],
              capture_output=True, text=True
          ).stdout.strip()
          if log:
              ultimo = datetime.fromtimestamp(int(log), tz=timezone.utc).date()
              dias = (today - ultimo).days
              if dias > MAX_STALE_DAYS:
                  print(f"PROBLEMA: index.html no recibe commits hace {dias} dias")
                  sys.exit(1)

          print("OK: CARRYIN_DATA presente y dentro del margen esperado.")
          EOF

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "Actualizacion mensual: produccion / carry-in / oferta - $(date -u +%Y-%m-%d)"
            git push
          else
            echo "Sin cambios"
          fi

      - name: Crear issue si algo fallo
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Fallo la actualizacion mensual de carry-in - $(date -u +%Y-%m-%d)" \
            --body "El workflow **${{ github.workflow }}** fallo. Ver el log completo aca: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Como este dato casi no cambia, el ultimo valor conocido sigue mostrandose en el dashboard sin problema mientras se soluciona."
