<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A3 Mercados — Noticias</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #f0f2f5;
  color: #1a1a2e;
  min-height: 100vh;
}

/* ── Header ── */
.header {
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  color: white;
  padding: 18px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}
.header-left h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: 0.5px; }
.header-left .sub { font-size: 0.75rem; opacity: 0.55; margin-top: 3px; }
.header-right { text-align: right; }
.header-right .update-label { font-size: 0.68rem; opacity: 0.45; }
.header-right .update-date  { font-size: 0.8rem; opacity: 0.75; margin-top: 2px; }

/* ── Barra de filtros ── */
.filter-bar {
  background: #16213e;
  padding: 10px 24px;
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.filter-chip {
  padding: 5px 14px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.15);
  background: transparent;
  color: rgba(255,255,255,0.5);
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
}
.filter-chip:hover { color: rgba(255,255,255,0.85); border-color: rgba(255,255,255,0.35); }
.filter-chip.active               { background: #4ecdc4; color: #1a1a2e; border-color: #4ecdc4; }
.filter-chip.chip-trigo.active    { background: #fcd34d; color: #1a1a2e; border-color: #fcd34d; }
.filter-chip.chip-maiz.active     { background: #86efac; color: #1a1a2e; border-color: #86efac; }
.filter-chip.chip-soja.active     { background: #93c5fd; color: #1a1a2e; border-color: #93c5fd; }
.filter-count { margin-left: auto; font-size: 0.72rem; color: rgba(255,255,255,0.3); }

/* ── Contenido ── */
.content {
  padding: 20px 24px;
  max-width: 780px;
  margin: 0 auto;
}
@media (max-width: 600px) { .content { padding: 14px 12px; } }

/* ── Estado vacío ── */
.empty-state { text-align: center; padding: 60px 20px; color: #aaa; }
.empty-state .icon { font-size: 2.8rem; margin-bottom: 12px; }
.empty-state p { font-size: 0.88rem; }

/* ── Lista de noticias (columna única) ── */
.news-list { display: flex; flex-direction: column; gap: 14px; }

/* ── Card ── */
.news-card {
  background: white;
  border-radius: 12px;
  padding: 18px 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  display: flex;
  flex-direction: column;
  gap: 10px;
  border-left: 4px solid #e8eaed;
  transition: box-shadow 0.15s, transform 0.1s;
}
.news-card:hover { box-shadow: 0 4px 18px rgba(0,0,0,0.10); transform: translateY(-1px); }
.news-card.c-trigo { border-left-color: #f59e0b; }
.news-card.c-maiz  { border-left-color: #22c55e; }
.news-card.c-soja  { border-left-color: #3b82f6; }
.news-card.c-multi { border-left-color: #8b5cf6; }

/* ── Meta de la card ── */
.card-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card-fecha { font-size: 0.72rem; color: #999; white-space: nowrap; }
.card-fuente {
  font-size: 0.72rem; font-weight: 700;
  background: #f0f2f5; color: #444;
  padding: 2px 9px; border-radius: 20px; white-space: nowrap;
}
.card-cultivo {
  font-size: 0.7rem; font-weight: 700;
  padding: 2px 9px; border-radius: 20px; white-space: nowrap;
}
.tag-trigo { background: #fef3c7; color: #92400e; }
.tag-maiz  { background: #dcfce7; color: #166534; }
.tag-soja  { background: #dbeafe; color: #1e3a8a; }
.tag-multi { background: #ede9fe; color: #4c1d95; }
.tag-gen   { background: #f3f4f6; color: #6b7280; }

.age-badge { font-size: 0.68rem; color: #bbb; margin-left: auto; white-space: nowrap; }
.age-badge.fresh { color: #16a34a; font-weight: 700; }

/* ── Cuerpo ── */
.card-titulo {
  font-size: 0.92rem;
  font-weight: 700;
  line-height: 1.45;
  color: #1a1a2e;
}
.card-resumen {
  font-size: 0.82rem;
  color: #4b5563;
  line-height: 1.65;
}

/* ── Footer ── */
.card-footer { padding-top: 2px; }
.btn-ver-nota {
  display: inline-block;
  background: #1a1a2e;
  color: white;
  font-size: 0.78rem;
  font-weight: 600;
  padding: 7px 18px;
  border-radius: 8px;
  text-decoration: none;
  transition: background 0.15s;
  font-family: inherit;
}
.btn-ver-nota:hover { background: #2d3a5e; }

/* ── Separador de fecha ── */
.date-divider {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 6px 0 2px;
  color: #9ca3af;
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.6px;
}
.date-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: #e5e7eb;
}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>📰 Noticias del campo</h1>
    <div class="sub">🌾 Trigo · 🌽 Maíz · 🫘 Soja — últimos 7 días</div>
  </div>
  <div class="header-right">
    <div class="update-label">🔄 Última actualización</div>
    <div class="update-date" id="update-date">—</div>
  </div>
</div>

<div class="filter-bar">
  <button class="filter-chip active"     onclick="setFilter('todos')" id="chip-todos">🌿 Todos</button>
  <button class="filter-chip chip-trigo" onclick="setFilter('trigo')" id="chip-trigo">🌾 Trigo</button>
  <button class="filter-chip chip-maiz"  onclick="setFilter('maiz')"  id="chip-maiz">🌽 Maíz</button>
  <button class="filter-chip chip-soja"  onclick="setFilter('soja')"  id="chip-soja">🫘 Soja</button>
  <span class="filter-count" id="filter-count"></span>
</div>

<div class="content">
  <div id="news-container"></div>
</div>

<script>

const NEWS_DATA = [
  {fecha:'2026-08-01',fuente:'Bichos de Campo',cultivo:'Maíz',titulo:'Tira y afloja: Se enfriaron otra vez las ventas de fertilizantes en el mercado argentino',resumen:'Las ventas de fertilizantes en el mercado argentino volvieron a ralentizarse esta semana de la mano de una caída de los precios de los granos y complicaciones climáticas que retrasan la cosecha de maíz (el principal producto generador de liquidez en la actual coyuntura). En lo que respecta a la urea, las operaciones con entregas […]',link:'https://bichosdecampo.com/tira-y-afloja-se-enfriaron-otra-vez-las-ventas-de-fertilizantes-en-el-mercado-argentino/'},
  {fecha:'2026-07-31',fuente:'Infocampo',cultivo:'Maíz',titulo:'La dicotomía del maíz: a días de la siembra gana poder de compra con algunos insumos, pero pierde con otros',resumen:'Un informe de Coninagro reveló que el maíz mejoró su relación de intercambio para la compra de maquinaria, vehículos y semillas. Sin embargo, el gasoil, los fertilizantes, los herbicidas y la reposición de hacienda continúan absorbiendo una mayor cantidad de kilos.',link:'https://www.infocampo.com.ar/la-dicotomia-del-maiz-a-dias-de-la-siembra-gana-poder-de-compra-con-algunos-insumos-pero-pierde-con-otros/'},
  {fecha:'2026-07-31',fuente:'Bichos de Campo',cultivo:'Trigo / Maíz / Soja',titulo:'Esta semana se rompió la “brújula” en el mercado de Chicago ¿Y ahora qué hacemos?',resumen:'Esta semana se rompió la “brújula” en el mercado estadounidense CME Group (“Chicago”) ya que una multiplicidad de variables alcistas derivó en bajas generalizadas de precios de maíz, trigo y soja. Los administradores de fondos agrícolas continuaron esta semana la fase de construcción de “apuestas alcistas” en contratos de maíz y soja del CME Group […]',link:'https://bichosdecampo.com/esta-semana-se-rompio-la-brujula-en-el-mercado-de-chicago-y-ahora-que-hacemos/'},
  {fecha:'2026-07-31',fuente:'Bichos de Campo',cultivo:'Trigo / Maíz / Soja',titulo:'En el primer semestre los productores vendieron solo 30% de la cosecha de soja: ¿Una estrategia para tratar de empalmar con la rebaja paulatina de retenciones a partir de 2027?',resumen:'Argentina ingresó al segundo semestre del 2026 con una situación agrícola paradójica. A mediados de julio, las ventas con precio cerrado de soja, maíz y trigo de la campaña 2025/26 alcanzaban 58,2 millones de toneladas, un volumen 20% superior a la mediana histórica. De todos modos, quedaba mucho porcentaje de la cosecha, especialmente en soja, […]',link:'https://bichosdecampo.com/en-el-primer-semestre-los-productores-vendieron-solo-30-de-la-cosecha-de-soja-una-estrategia-para-tratar-de-empalmar-con-la-rebaja-paulatina-de-retenciones-a-partir-de-2027/'},
  {fecha:'2026-07-29',fuente:'Bichos de Campo',cultivo:'Maíz',titulo:'El mercado argentino de maíz sigue inmune al virus bajista presente en Chicago',resumen:'A los exportadores argentinos les está costando originar maíz para poder completar embarques y esa circunstancia evita que el mercado local se “contagie” de la tendencia bajista presente en el CME Group (“Chicago”). Este miércoles la autoridad monetaria de EE.UU. (Reserva Federal) decidió mantener las tasas de interés de referencia en un nivel de 3,50%-3,75% […]',link:'https://bichosdecampo.com/el-mercado-argentino-de-maiz-sigue-inmune-al-virus-bajista-presente-en-chicago/'},
  {fecha:'2026-07-29',fuente:'Bichos de Campo',cultivo:'Maíz',titulo:'¿Qué te comprás con lo que cosechás? Un informe de Coninagro asegura que se complicó la relación insumo-producto para la próxima campaña de maíz',resumen:'La próxima campaña de maíz, que iniciará en un par de meses, está en un escenario de costos complejo. Esa es la principal conclusión que surge del Monitor Insumo-Producto elaborado por Coninagro, que analiza la capacidad de compra de los principales productos agropecuarios frente a insumos, servicios e inversiones. Si bien el cereal ganó terreno […]',link:'https://bichosdecampo.com/que-te-compras-con-lo-que-cosechas-un-informe-de-coninagro-asegura-que-se-complico-la-relacion-insumo-producto-para-la-proxima-campana-de-maiz/'},
  {fecha:'2026-07-28',fuente:'Infocampo',cultivo:'Soja',titulo:'La polinización también define a la soja: un hallazgo del INTA y el Conicet cambia un paradigma agrícola',resumen:'Una investigación argentina demuestra que la soja no depende únicamente de la autopolinización para formar semillas. El estudio detectó un mecanismo reproductivo hasta ahora desconocido y reveló que los polinizadores silvestres cumplen un papel clave para sostener el rendimiento.',link:'https://www.infocampo.com.ar/la-polinizacion-tambien-define-a-la-soja-un-hallazgo-del-inta-y-el-conicet-cambia-un-paradigma-agricola/'},
  {fecha:'2026-07-28',fuente:'Bichos de Campo',cultivo:'Trigo',titulo:'Hagan sus apuestas: La oficina del USDA en Canberra estima que la cosecha australiana de trigo no caerá de manera tan dramática',resumen:'Mientras que el último informe oficial del USDA proyectó una cosecha australiana de trigo de 28,0 millones de toneladas para 2026/27 versus 35,9 millones en el ciclo previo, la oficina del organismo estadounidense en esa nación estima que la caída no será dramática y prevé una producción de 31,0 millones de toneladas. En ese marco, […]',link:'https://bichosdecampo.com/hagan-sus-apuestas-la-oficina-del-usda-en-canberra-estima-que-la-cosecha-australiana-de-trigo-no-caera-de-manera-tan-dramatica/'},
  {fecha:'2026-07-28',fuente:'Bichos de Campo',cultivo:'Maíz / Soja',titulo:'Recuperación de los precios de la soja y el maíz ante el temor de que el “apagón logístico” del Mar Negro se extienda por meses',resumen:'Luego de que ayer se registrara una toma de ganancias importante en el mercado de futuros agrícolas del CME Group (“Chicago”), este martes los valores de la soja y el maíz se recuperaron ante la incertidumbre generada por el “apagón logístico” presente en el Mar Negro. Los valores de la soja en el CME Group […]',link:'https://bichosdecampo.com/recuperacion-de-los-precios-de-la-soja-y-el-maiz-ante-el-temor-de-que-el-apagon-logistico-del-mar-negro-se-extienda-por-meses/'},
  {fecha:'2026-07-26',fuente:'Bichos de Campo',cultivo:'Trigo / Maíz / Soja',titulo:'Proximidad geográfica: Seis mapas para entender un factor de competitividad clave de la agroindustria argentina',resumen:'Al sumar la producción de los seis cultivos principales de Argentina –soja, maíz, trigo, girasol, cebada y sorgo– se observa que el 67% del total nacional se localiza a 300 kilómetros de complejos portuarios. Se trata de una ventaja logística estructural de la agroindustria argentina, ya que en EE.UU. y Brasil la producción de granos […]',link:'https://bichosdecampo.com/proximidad-geografica-seis-mapas-para-entender-un-factor-de-competitividad-clave-de-la-agroindustria-argentina/'},
  {fecha:'2026-07-25',fuente:'Infocampo',cultivo:'Maíz',titulo:'Precio del maíz en Rosario hoy 25 julio 2026',resumen:'Todo sobre la cotización de maíz, precio en tiempo real.',link:'https://www.infocampo.com.ar/precio-del-maiz-hoy-25-julio-2026/'},
  {fecha:'2026-07-25',fuente:'Infocampo',cultivo:'Trigo',titulo:'Precio del Trigo en Rosario hoy 25 julio 2026',resumen:'Todo sobre la cotización del trigo, precio en tiempo real.',link:'https://www.infocampo.com.ar/precio-del-trigo-hoy-25-julio-2026/'},
  {fecha:'2026-07-25',fuente:'Bichos de Campo',cultivo:'Maíz',titulo:'El agrónomo Ricardo Maich tiene algo que contar sobre el cultivo familiar de maíz y la posibilidad de realizar mejoramiento propio',resumen:'Ricardo Héctor Maich, que es ingeniero agrónomo e investigador de la Facultad de Ciencias Agropecuarias de la Universidad Nacional de Córdoba, volvió a escribir para Bichos de Campo, esta vez par contarnos que existe la posibilidad de realizar mejoramiento de maíz no modificado en pequeña escala y no depender de la compra de nueva semilla […]',link:'https://bichosdecampo.com/el-agronomo-ricardo-maich-tiene-algo-que-contar-sobre-el-cultivo-familiar-de-maiz-y-la-posibilidad-de-realizar-mejoramiento-propio/'},
  {fecha:'2026-07-25',fuente:'Bichos de Campo',cultivo:'Trigo / Maíz / Soja',titulo:'“El Chaco fue siempre del algodón y se va a seguir sembrando algodón”, afirma Carlos Víctor Talalay, productor de Tres Isletas que incorporó nuevos cultivos a sus rotaciones pero mantiene su corazoncito en el textil',resumen:'En el Chaco ya casi no quedan productores dedicados exclusivamente al algodón, como era antiguamente, casi un monocultuvo. Gracias a las nuevas variedades de soja y otros cultivos adaptados al clima del norte, lo que se encuentra ahora en la zona agrícola de esa provincia son agricultores que siembran trigo, soja, girasol, maíz y hasta […]',link:'https://bichosdecampo.com/el-chaco-fue-siempre-del-algodon-y-se-va-a-seguir-sembrando-algodon-afirma-carlos-victor-talalay-productor-de-tres-isletas-que-incorporo-nuevos-cultivos-a-sus-rotaciones-pero-mantiene-su-corazon/'},
  {fecha:'2026-07-24',fuente:'Infocampo',cultivo:'Trigo / Soja',titulo:'Más información para mejores decisiones: al igual que el trigo, la soja tendrá su Mapa de Calidad',resumen:'En el marco de La Rural, la Secretaría de Agricultura presentó avances de esta iniciativa que ya tuvo una prueba piloto en la última cosecha. "Permitirá incorporar mediciones de calidad comercial de soja, una herramienta fundamental", destacaron desde el Gobierno.',link:'https://www.infocampo.com.ar/mas-informacion-para-mejores-decisiones-al-igual-que-el-trigo-la-soja-tendra-su-mapa-de-calidad/'},
  {fecha:'2026-07-24',fuente:'Infocampo',cultivo:'Maíz',titulo:'El maíz no descansa: tras una cosecha cada vez más récord, ya se proyecta otra siembra histórica',resumen:'Con una producción 2025/26 estimada por el Gobierno en 71,5 millones de toneladas, el maíz alcanzará un nuevo máximo histórico. A la par, la zona núcleo ya anticipa otra siembra récord, impulsada por las buenas perspectivas climáticas.',link:'https://www.infocampo.com.ar/el-maiz-no-descansa-tras-una-cosecha-cada-vez-mas-record-ya-se-proyecta-otra-siembra-historica/'},
  {fecha:'2026-07-24',fuente:'Infocampo',cultivo:'Maíz',titulo:'Precio del maíz en Rosario hoy 24 julio 2026',resumen:'Todo sobre la cotización de maíz, precio en tiempo real.',link:'https://www.infocampo.com.ar/precio-del-maiz-hoy-24-julio-2026/'},
  {fecha:'2026-07-24',fuente:'Infocampo',cultivo:'Trigo',titulo:'Precio del Trigo en Rosario hoy 24 julio 2026',resumen:'Todo sobre la cotización del trigo, precio en tiempo real.',link:'https://www.infocampo.com.ar/precio-del-trigo-hoy-24-julio-2026/'},
  {fecha:'2026-07-24',fuente:'Infocampo',cultivo:'Soja',titulo:'Precio de la Soja en Rosario hoy 24 julio 2026',resumen:'Todo sobre la cotización de soja, precio en tiempo real. Pizarra Rosario, cotización de cereales',link:'https://www.infocampo.com.ar/precio-de-la-soja-hoy-24-julio-2026/'},
  {fecha:'2026-07-24',fuente:'Bichos de Campo',cultivo:'Maíz',titulo:'Optimismo: Aún no comenzó la campaña, pero en la Bolsa de Rosario ya se entusiasman con una siembra récord de maíz',resumen:'Todavía faltan 45 días para que arranque la siembra de maíz en la región núcleo, pero el informe semanal de la Bolsa de Comercio de Rosario (BCR) ya deja trascender un clima de entusiasmo entre los técnicos que recorren los campos. Según indicó un informe de los rosarinos, con 2,3 millones de hectáreas de intención […]',link:'https://bichosdecampo.com/optimismo-aun-no-comenzo-la-campana-pero-en-la-bolsa-de-rosario-se-entusiasman-con-una-siembra-record-de-maiz/'},
  {fecha:'2026-07-24',fuente:'Bichos de Campo',cultivo:'Maíz / Soja',titulo:'Pum para arriba: Siguen subiendo las “apuestas” alcistas en maíz y soja por parte de los fondos agrícolas',resumen:'Los administradores de fondos agrícolas continuaron esta semana la fase de construcción de “apuestas alcistas” en contratos de maíz y soja del CME Group (“Chicago”), lo que contribuyó a potenciar los factores propios del mercado. El martes pasado la posición neta especulativa en contratos futuros y opciones de maíz en el CME Group (“Chicago”) siguió […]',link:'https://bichosdecampo.com/pum-para-arriba-siguen-subiendo-las-apuestas-alcistas-en-maiz-y-soja-por-parte-de-los-fondos-agricolas/'},
  {fecha:'2026-07-23',fuente:'Bichos de Campo',cultivo:'Soja',titulo:'Se está llevando a cabo una prueba piloto para armar el primer “mapa de calidad de soja” de la Argentina',resumen:'Las autoridades de la Secretaría de Agricultura comenzaron a instrumentar la metodología para armar un “mapa de calidad de soja” que permita identificar los valores promedio de humedad, proteína y materia grasa en cada una de las regiones productivas. En ese marco, se realizó este miércoles una reunión de trabajo en la Exposición Rural de […]',link:'https://bichosdecampo.com/se-esta-llevando-a-cabo-una-prueba-piloto-para-armar-el-primer-mapa-de-calidad-de-soja-de-la-argentina/'},
  {fecha:'2026-07-23',fuente:'Bichos de Campo',cultivo:'Maíz',titulo:'Lo que mata es la humedad: La cosecha argentina de maíz está muy retrasada y los exportadores siguen urgidos por completar embarques',resumen:'Si bien la Argentina va camino a lograr un cosechón histórico de maíz, falta mucho para completar la recolección y además buena parte de la levantado tienen niveles de humedad que hacen inviable la comercialización del cereal. La cosecha de maíz con destino grano comercial alcanzó el 66,8% del área programada a nivel nacional con […]',link:'https://bichosdecampo.com/lo-que-mata-es-la-humedad-la-cosecha-argentina-de-maiz-esta-muy-retrasada-y-los-exportadores-siguen-urgidos-por-completar-embarques/'},

/* ═══════════════════════════════════════════════════════════════════════ */

var currentFilter = 'todos';

function setFilter(crop) {
  currentFilter = crop;
  ['todos','trigo','maiz','soja'].forEach(function(c) {
    var el = document.getElementById('chip-' + c);
    if (el) el.classList.toggle('active', c === crop);
  });
  render();
}

function render() {
  var container = document.getElementById('news-container');
  var countEl   = document.getElementById('filter-count');
  var updateEl  = document.getElementById('update-date');
  var cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - 7);

  var items = NEWS_DATA.filter(function(n) {
    var d = new Date(n.fecha);
    if (d < cutoff) return false;
    if (currentFilter === 'todos') return true;
    return n.cultivo.toLowerCase().indexOf(currentFilter) >= 0;
  });

  if (countEl) countEl.textContent = items.length + ' nota' + (items.length !== 1 ? 's' : '');
  if (updateEl && NEWS_DATA.length > 0) updateEl.textContent = NEWS_DATA[0].fecha;

  if (items.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="icon">🌿</div><p>No hay noticias para el filtro seleccionado.</p></div>';
    return;
  }

  var html = '<div class="news-list">';
  var lastDate = '';

  items.forEach(function(n) {
    var colorClass = n.cultivo.indexOf('/') >= 0 ? 'c-multi'
      : n.cultivo.toLowerCase().indexOf('trigo') >= 0 ? 'c-trigo'
      : (n.cultivo.toLowerCase().indexOf('maíz') >= 0 || n.cultivo.toLowerCase().indexOf('maiz') >= 0) ? 'c-maiz'
      : n.cultivo.toLowerCase().indexOf('soja') >= 0 ? 'c-soja' : '';

    var tagClass = n.cultivo.indexOf('/') >= 0 ? 'tag-multi'
      : n.cultivo.toLowerCase().indexOf('trigo') >= 0 ? 'tag-trigo'
      : (n.cultivo.toLowerCase().indexOf('maíz') >= 0 || n.cultivo.toLowerCase().indexOf('maiz') >= 0) ? 'tag-maiz'
      : n.cultivo.toLowerCase().indexOf('soja') >= 0 ? 'tag-soja' : 'tag-gen';

    var daysAgo = Math.floor((new Date() - new Date(n.fecha)) / 86400000);
    var age = daysAgo === 0 ? 'Hoy' : daysAgo === 1 ? 'Ayer' : 'Hace ' + daysAgo + ' días';
    var isFresh = daysAgo <= 1;

    if (n.fecha !== lastDate) {
      var label = daysAgo === 0 ? 'Hoy' : daysAgo === 1 ? 'Ayer'
        : new Date(n.fecha + 'T00:00:00').toLocaleDateString('es-AR', {weekday:'long', day:'numeric', month:'long'});
      html += '<div class="date-divider">' + label + '</div>';
      lastDate = n.fecha;
    }

    var resumen = n.resumen.length > 220 ? n.resumen.slice(0, 220).replace(/\s\S+$/, '') + '…' : n.resumen;

    html += '<div class="news-card ' + colorClass + '">'
      + '<div class="card-meta">'
      + '<span class="card-fecha">' + n.fecha + '</span>'
      + '<span class="card-fuente">' + n.fuente + '</span>'
      + '<span class="card-cultivo ' + tagClass + '">' + n.cultivo + '</span>'
      + '<span class="age-badge' + (isFresh ? ' fresh' : '') + '">' + age + '</span>'
      + '</div>'
      + '<div class="card-titulo">' + n.titulo + '</div>'
      + '<div class="card-resumen">' + resumen + '</div>'
      + '<div class="card-footer"><a class="btn-ver-nota" href="' + n.link + '" target="_blank" rel="noopener">Ver nota →</a></div>'
      + '</div>';
  });

  html += '</div>';
  container.innerHTML = html;
}

document.addEventListener('DOMContentLoaded', render);

</script>
</body>
</html>
